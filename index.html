/* ============================== UTILITIES ============================== */

const uid = (prefix) => prefix + '_' + Math.random().toString(36).slice(2, 9);

const CURRENCIES = {
  USD: { symbol: '$', name: 'US Dollar' },
  KES: { symbol: 'KSh', name: 'Kenyan Shilling' },
  EUR: { symbol: '€', name: 'Euro' },
  GBP: { symbol: '£', name: 'British Pound' },
  NGN: { symbol: '₦', name: 'Nigerian Naira' },
  ZAR: { symbol: 'R', name: 'South African Rand' },
  GHS: { symbol: 'GH₵', name: 'Ghanaian Cedi' },
  INR: { symbol: '₹', name: 'Indian Rupee' },
};

function fmtMoney(amount, currencyCode) {
  const c = CURRENCIES[currencyCode] || CURRENCIES.USD;
  const n = Number(amount) || 0;
  return c.symbol + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function fmtDateTime(d) {
  const date = typeof d === 'string' ? new Date(d) : d;
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
    date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
function isoDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString();
}
function dayKey(iso) {
  return new Date(iso).toISOString().slice(0, 10);
}

function downloadCSV(filename, rows) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const escape = (v) => {
    const s = String(v === undefined || v === null ? '' : v);
    if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  };
  const csv = [headers.join(','), ...rows.map(r => headers.map(h => escape(r[h])).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function initials(name) {
  return (name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

/* ============================== SHARED UI ============================== */

function Button({ children, variant = 'primary', size = 'md', className = '', icon, ...rest }) {
  const base = 'inline-flex items-center justify-center gap-1.5 font-medium rounded-md transition-colors disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap';
  const sizes = { sm: 'px-2.5 py-1.5 text-sm', md: 'px-3.5 py-2 text-sm', lg: 'px-5 py-2.5 text-[15px]' };
  const variants = {
    primary: 'bg-ink text-paper hover:bg-ink-soft',
    brass: 'bg-brass text-white hover:bg-brass-dark',
    outline: 'border border-line text-ink hover:bg-paper-dim bg-paper-raised',
    ghost: 'text-ink-muted hover:bg-paper-dim',
    danger: 'bg-clay text-white hover:bg-clay/90',
    subtle: 'bg-paper-dim text-ink hover:bg-line',
  };
  return (
    <button className={base + ' ' + sizes[size] + ' ' + variants[variant] + ' ' + className} {...rest}>
      {icon}{children}
    </button>
  );
}

function Card({ children, className = '', title, subtitle, action, padded = true }) {
  return (
    <div className={'bg-paper-raised border border-line rounded-xl ' + className}>
      {(title || action) && (
        <div className="flex items-start justify-between px-5 pt-4 pb-2">
          <div>
            {title && <h3 className="font-display text-[17px] font-medium text-ink">{title}</h3>}
            {subtitle && <p className="text-xs text-ink-muted mt-0.5">{subtitle}</p>}
          </div>
          {action}
        </div>
      )}
      <div className={padded ? 'p-5' + (title ? ' pt-3' : '') : ''}>{children}</div>
    </div>
  );
}

function Badge({ children, tone = 'default' }) {
  const tones = {
    default: 'bg-paper-dim text-ink-muted',
    good: 'bg-moss-light text-moss',
    warn: 'bg-brass-light text-brass-dark',
    bad: 'bg-clay-light text-clay',
    brand: 'bg-ink text-paper',
  };
  return <span className={'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ' + tones[tone]}>{children}</span>;
}

function Input({ label, hint, className = '', ...rest }) {
  return (
    <label className="block">
      {label && <span className="block text-xs font-medium text-ink-muted mb-1">{label}</span>}
      <input className={'w-full px-3 py-2 rounded-md border border-line bg-paper-raised text-sm text-ink placeholder:text-ink-muted/60 ' + className} {...rest} />
      {hint && <span className="block text-xs text-ink-muted mt-1">{hint}</span>}
    </label>
  );
}

function Select({ label, options, className = '', ...rest }) {
  return (
    <label className="block">
      {label && <span className="block text-xs font-medium text-ink-muted mb-1">{label}</span>}
      <select className={'w-full px-3 py-2 rounded-md border border-line bg-paper-raised text-sm text-ink ' + className} {...rest}>
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </label>
  );
}

function Textarea({ label, className = '', ...rest }) {
  return (
    <label className="block">
      {label && <span className="block text-xs font-medium text-ink-muted mb-1">{label}</span>}
      <textarea className={'w-full px-3 py-2 rounded-md border border-line bg-paper-raised text-sm text-ink ' + className} {...rest} />
    </label>
  );
}

function Modal({ open, onClose, title, children, width = 'max-w-lg', footer }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/40 backdrop-blur-[1px]" onClick={onClose} />
      <div className={'relative bg-paper-raised rounded-xl border border-line shadow-2xl w-full ' + width + ' max-h-[88vh] flex flex-col rise-in'}>
        <div className="flex items-center justify-between px-5 py-4 border-b border-line">
          <h3 className="font-display text-lg font-medium">{title}</h3>
          <button onClick={onClose} className="text-ink-muted hover:text-ink p-1 rounded hover:bg-paper-dim"><IconX size={18} /></button>
        </div>
        <div className="px-5 py-4 overflow-y-auto">{children}</div>
        {footer && <div className="px-5 py-3.5 border-t border-line flex justify-end gap-2">{footer}</div>}
      </div>
    </div>
  );
}

function EmptyState({ icon, title, message, action }) {

function BarChart({ data, height = 160, formatValue, barColor = 'var(--ink)' }) {

    <div>

          <div key={i} className="flex-1 flex flex-col items-center justify-end h-full group relative">

function seedRoles() {
  return Object.entries(SYSTEM_ROLE_DEFAULTS).map(([key, def]) => ({
    id: key, name: def.name, description: def.description, permissions: [...def.permissions],
    isSystem: true, isOwner: !!def.isOwner, active: true,
  }));
}

/** Effective permissions = role permissions, plus additional grants, minus explicit restrictions. Owner is always all-access and immune to restriction. */
function getEffectivePermissions(employee, roles) {
  if (!employee) return new Set();
  const role = roles.find(r => r.id === employee.roleId);
  if (role && role.isOwner) return new Set(ALL_PERMISSION_IDS);
  const base = new Set(role ? role.permissions : []);
  (employee.additionalPermissions || []).forEach(p => base.add(p));
  (employee.restrictedPermissions || []).forEach(p => base.delete(p));
  return base;
}
function can(employee, roles, permissionId) {
  if (!employee || employee.status !== 'active') return false;
  return getEffectivePermissions(employee, roles).has(permissionId);
}
/** An employee who could approve a sensitive action on someone else's behalf: has the permission, is active, and isn't the requester. */
function findApprovers(employees, roles, permissionId, excludeId) {
  return employees.filter(e => e.id !== excludeId && e.status === 'active' && can(e, roles, permissionId));
}

async function hashPin(pin) {
  try {
    const data = new TextEncoder().encode(String(pin));
    const digest = await window.crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    // Fallback for non-secure contexts where SubtleCrypto is unavailable — still never plaintext.
    let h = 0; const s = String(pin);
    for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return 'fallback_' + Math.abs(h).toString(16);
  }
}

/** Hash every seeded employee's demo PIN (never keep plaintext around, even in a demo). */
async function finalizeSeedPins(employees) {
  return Promise.all(employees.map(async (e) => {
    const { pin, ...rest } = e;
    return { ...rest, pinHash: pin ? await hashPin(pin) : null };
  }));
}

function Dashboard({ state, ctx, actions }) {
  const { sales, products, expenses, purchases, business, dashboardPrefs } = state;
  const [customizing, setCustomizing] = useState(false);
  const currency = business.currency;
  const today = dayKey(new Date().toISOString());
  const todaySales = sales.filter(s => dayKey(s.date) === today);
  const todayRevenue = todaySales.reduce((a, s) => a + s.total, 0);
  const yesterday = dayKey(isoDaysAgo(1));
  const yestSales = sales.filter(s => dayKey(s.date) === yesterday);
  const yestRevenue = yestSales.reduce((a, s) => a + s.total, 0);
  const revenueDelta = yestRevenue ? Math.round(((todayRevenue - yestRevenue) / yestRevenue) * 100) : 0;

  const last14 = [...Array(14)].map((_, i) => {
    const key = dayKey(isoDaysAgo(13 - i));
    const total = sales.filter(s => dayKey(s.date) === key).reduce((a, s) => a + s.total, 0);
    return { label: new Date(key).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }).split(' ')[0], value: total };
  });

  const productSales = {};
  sales.forEach(s => s.items.forEach(it => { productSales[it.name] = (productSales[it.name] || 0) + it.qty; }));
  const topProducts = Object.entries(productSales).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([label, value]) => ({ label, value }));

  const lowStock = products.filter(p => !p.isComposite && p.stock <= p.reorderLevel);
  const grossProfit = sales.reduce((a, s) => a + s.items.reduce((b, it) => {
    const p = products.find(pp => pp.id === it.productId);
    return b + (p ? (it.price - p.cost) * it.qty : 0);
  }, 0), 0);
  const totalExpenses = expenses.reduce((a, e) => a + e.amount, 0);
  const pendingPO = purchases.filter(p => p.status === 'pending').length;
  const recent = sales.slice(0, 6);

  const WIDGET_LABELS = { stats: 'Key stats', trendRow: 'Sales trend & top products', recentRow: 'Recent transactions & attention needed' };
  const visibleOrder = dashboardPrefs.order.filter(k => !dashboardPrefs.hidden.includes(k));

  const blocks = {
    stats: (
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <StatCard label="Today's revenue" value={fmtMoney(todayRevenue, currency)} delta={Math.abs(revenueDelta) + '% vs yesterday'} deltaGood={revenueDelta >= 0} />
        <StatCard label="Today's orders" value={todaySales.length} sub={sales.length + ' all time'} />
        <StatCard label="Gross profit (all time)" value={fmtMoney(grossProfit, currency)} sub="Since launch" />
        <StatCard label="Low stock items" value={lowStock.length} sub={lowStock.length ? 'Needs attention' : 'All healthy'} />
      </div>
    ),
    trendRow: (
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card title="Sales, last 14 days" className="lg:col-span-2">
          <BarChart data={last14} formatValue={v => fmtMoney(v, currency)} />
        </Card>
        <Card title="Top products" subtitle="By units sold">
          {topProducts.length ? <HBarList data={topProducts} /> : <p className="text-sm text-ink-muted">No sales yet.</p>}
        </Card>
      </div>
    ),
    recentRow: (
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <Card title="Recent transactions" className="lg:col-span-2" padded={false}
          action={<Button size="sm" variant="ghost" onClick={() => ctx.setPage('reports')}>View all</Button>}>
          {recent.length === 0 ? <div className="px-5 pb-5"><EmptyState icon={<IconReceipt size={22}/>} title="No sales yet" message="Sales will appear here once you start ringing up orders in the POS." /></div> : (
            <table className="w-full text-sm">
              <tbody>
                {recent.map(s => (
                  <tr key={s.id} className="border-t border-line first:border-t-0">
                    <td className="px-5 py-3 text-ink-muted whitespace-nowrap">{fmtDateTime(s.date)}</td>
                    <td className="px-2 py-3">{s.customerName}</td>
                    <td className="px-2 py-3 text-ink-muted">{s.items.length} item{s.items.length !== 1 ? 's' : ''}</td>
                    <td className="px-2 py-3"><Badge tone="default">{s.paymentMethod}</Badge></td>
                    <td className="px-5 py-3 text-right font-medium tabular">{fmtMoney(s.total, currency)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </Card>
        <Card title="Attention needed">
          <div className="space-y-3">
            {lowStock.slice(0, 4).map(p => (
              <div key={p.id} className="flex items-center justify-between text-sm">
                <span className="truncate pr-2">{p.name}</span>
                <Badge tone="warn">{p.stock} left</Badge>
              </div>
            ))}
            {pendingPO > 0 && (
              <div className="flex items-center justify-between text-sm">
                <span>Purchase orders awaiting receipt</span>
                <Badge tone="default">{pendingPO}</Badge>
              </div>
            )}
            {lowStock.length === 0 && pendingPO === 0 && <p className="text-sm text-ink-muted">Nothing needs attention right now.</p>}
            <div className="pt-2 border-t border-line flex justify-between text-sm">
              <span className="text-ink-muted">Expenses (all time)</span>
              <span className="font-medium tabular">{fmtMoney(totalExpenses, currency)}</span>
            </div>
          </div>
        </Card>
      </div>
    ),
  };

  return (
    <div className="space-y-5">
      <div className="flex justify-end">
        <Button size="sm" variant="ghost" onClick={() => setCustomizing(c => !c)}>{customizing ? 'Done' : 'Customize dashboard'}</Button>
      </div>
      {customizing && (
        <Card>
          <p className="text-xs font-semibold text-ink-muted mb-2">Show, hide, and reorder dashboard sections</p>
          <div className="space-y-1.5">
            {dashboardPrefs.order.map((key, i) => (
              <div key={key} className="flex items-center justify-between px-2 py-1.5 rounded-md hover:bg-paper-dim">
                <span className="text-sm">{WIDGET_LABELS[key]}</span>
                <div className="flex items-center gap-1">
                  <button disabled={i === 0} onClick={() => actions.moveDashboardWidget(key, -1)} className="p-1 rounded hover:bg-paper-dim disabled:opacity-30"><IconArrowUp size={14}/></button>
                  <button disabled={i === dashboardPrefs.order.length - 1} onClick={() => actions.moveDashboardWidget(key, 1)} className="p-1 rounded hover:bg-paper-dim disabled:opacity-30"><IconArrowDown size={14}/></button>
                  <button onClick={() => actions.toggleDashboardWidget(key)} className={'w-9 h-5 rounded-full transition-colors relative ml-2 ' + (!dashboardPrefs.hidden.includes(key) ? 'bg-brass' : 'bg-line')}>
                    <span className={'absolute top-0.5 w-4 h-4 rounded-full bg-white transition-transform ' + (!dashboardPrefs.hidden.includes(key) ? 'translate-x-4' : 'translate-x-0.5')} />
                  </button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      )}
      {visibleOrder.map(key => <div key={key}>{blocks[key]}</div>)}
    </div>
  );
}

/** Effective sellable stock for a product: composites are capped by their scarcest ingredient; variants are summed. */
function effectiveStock(product, allProducts) {
  if (product.isComposite) {
    if (!product.components || product.components.length === 0) return 0;
    return Math.min(...product.components.map(c => {
      const ing = allProducts.find(p => p.id === c.productId);
      return ing ? Math.floor(ing.stock / c.qty) : 0;
    }));
  }
  if (product.variants && product.variants.length > 0) return product.variants.reduce((a, v) => a + v.stock, 0);
  return product.stock;
}

const CUSTOM_DISCOUNT_THRESHOLD = 20; // % — beyond this, pos.discount.custom (or manager approval) is required

function POS({ state, actions, ctx }) {
  const { products, customers, business, employees, settings, roles, loyaltySettings, coupons, tables } = state;
  const currentEmployee = ctx.currentEmployee;
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('All');
  const [cart, setCart] = useState([]);
  const [customerId, setCustomerId] = useState(customers.find(c => c.isWalkIn)?.id || customers[0]?.id);
  const [discount, setDiscount] = useState(0);
  const [heldOrders, setHeldOrders] = useState([]);
  const [showCheckout, setShowCheckout] = useState(false);
  const [receipt, setReceipt] = useState(null);
  const [note, setNote] = useState('');
  const [showHistory, setShowHistory] = useState(false);
  const [variantPicker, setVariantPicker] = useState(null); // product with variants awaiting selection
  const [couponCode, setCouponCode] = useState('');
  const [appliedCoupon, setAppliedCoupon] = useState(null);
  const [redeemPoints, setRedeemPoints] = useState(0);
  const [tableId, setTableId] = useState('');

  const canDiscount = can(currentEmployee, roles, 'pos.discount.apply');
  const canCustomDiscount = can(currentEmployee, roles, 'pos.discount.custom');
  const canRefund = can(currentEmployee, roles, 'pos.refund');
  const canViewHistory = can(currentEmployee, roles, 'pos.history.view');
  const canRedeemLoyalty = settings.enabledModules.loyalty && can(currentEmployee, roles, 'loyalty.redeem');
  const restaurantOn = settings.enabledModules.restaurant;

  const categories = ['All', ...Array.from(new Set(products.map(p => p.category)))];
  const filtered = products.filter(p =>
    p.status !== 'discontinued' &&
    (category === 'All' || p.category === category) &&
    (search === '' || p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase()) || p.barcode.includes(search))
  );

  const addVariantToCart = (product, variant) => {
    if (variant.stock <= 0) { ctx.toast('That variant is out of stock.', 'bad'); return; }
    setCart(c => {
      const existing = c.find(i => i.productId === product.id && i.variantId === variant.id);
      if (existing) {
        if (existing.qty >= variant.stock) { ctx.toast('No more stock available.', 'bad'); return c; }
        return c.map(i => i === existing ? { ...i, qty: i.qty + 1 } : i);
      }
      return [...c, { productId: product.id, variantId: variant.id, name: product.name + ' – ' + variant.name, price: product.price + variant.priceDelta, qty: 1 }];
    });
    setVariantPicker(null);
  };

  const addToCart = (p) => {
    if (p.variants && p.variants.length > 0) { setVariantPicker(p); return; }
    const avail = effectiveStock(p, products);
    if (avail <= 0) { ctx.toast('That item is out of stock.', 'bad'); return; }
    setCart(c => {
      const existing = c.find(i => i.productId === p.id && !i.variantId);
      if (existing) {
        if (existing.qty >= avail) { ctx.toast('No more stock available.', 'bad'); return c; }
        return c.map(i => i === existing ? { ...i, qty: i.qty + 1 } : i);
      }
      return [...c, { productId: p.id, variantId: null, name: p.name, price: p.price, qty: 1 }];
    });
  };
  const updateQty = (idx, delta) => {
    setCart(c => c.map((i, ii) => {
      if (ii !== idx) return i;
      const prod = products.find(p => p.id === i.productId);
      const cap = i.variantId ? (prod?.variants.find(v => v.id === i.variantId)?.stock ?? 99) : effectiveStock(prod || {}, products);
      const newQty = Math.max(1, Math.min(cap, i.qty + delta));
      return { ...i, qty: newQty };
    }));
  };
  const removeFromCart = (idx) => setCart(c => c.filter((_, ii) => ii !== idx));

  const subtotal = cart.reduce((a, i) => a + i.price * i.qty, 0);
  const discountAmt = subtotal * (discount / 100);
  const couponDiscount = appliedCoupon ? (appliedCoupon.type === 'percent' ? subtotal * (appliedCoupon.value / 100) : Math.min(appliedCoupon.value, subtotal)) : 0;
  const pointsDiscount = canRedeemLoyalty ? (redeemPoints / (loyaltySettings.redemptionRate || 100)) : 0;
  const taxable = Math.max(0, subtotal - discountAmt - couponDiscount - pointsDiscount);
  const tax = taxable * (business.taxRate / 100);
  const total = taxable + tax;

  const selectedCustomer = customers.find(c => c.id === customerId);
  const maxRedeemable = selectedCustomer ? (selectedCustomer.loyaltyPoints || 0) : 0;

  const applyCoupon = () => {
    const c = coupons.find(cc => cc.code.toUpperCase() === couponCode.trim().toUpperCase() && cc.active);
    if (!c) { ctx.toast('Invalid or inactive coupon code.', 'bad'); return; }
    if (c.usageLimit && c.usedCount >= c.usageLimit) { ctx.toast('This coupon has reached its usage limit.', 'bad'); return; }
    setAppliedCoupon(c);
    ctx.toast('Coupon applied.', 'good');
  };

  const holdOrder = () => {
    if (!cart.length) return;
    setHeldOrders(h => [...h, { id: uid('hold'), cart, customerId, discount, note, time: new Date().toISOString() }]);
    setCart([]); setDiscount(0); setNote('');
    ctx.toast('Order held.', 'good');
  };
  const resumeOrder = (h) => {
    setCart(h.cart); setCustomerId(h.customerId); setDiscount(h.discount); setNote(h.note);

    setHeldOrders(hs => hs.filter(x => x.id !== h.id));
  };

  const finalizeSale = (paymentMethod, splitPayments) => {
    const cust = customers.find(c => c.id === customerId);
    const emp = currentEmployee || employees[0];
    const pointsEarned = (!cust || cust.isWalkIn) ? 0 : Math.floor(taxable * (loyaltySettings.pointsPerCurrencyUnit / (loyaltySettings.currencyUnitsPerPoint || 1)));
    const sale = {
      id: uid('sale'), date: new Date().toISOString(),
      items: cart.map(i => ({ productId: i.productId, variantId: i.variantId || null, name: i.name, qty: i.qty, price: i.price, total: i.price * i.qty })),
      subtotal, discount: discountAmt + couponDiscount + pointsDiscount, discountPct: discount, couponCode: appliedCoupon?.code || null,
      pointsRedeemed: redeemPoints || 0, pointsEarned, tax, total,
      paymentMethod: splitPayments ? 'Split (' + splitPayments.map(p => p.method).join(' + ') + ')' : paymentMethod,
      splitPayments: splitPayments || null,
      customerId, customerName: cust ? cust.name : 'Walk-in', employeeId: emp.id, employeeName: emp.name, status: 'completed', note,
      tableId: restaurantOn && tableId ? tableId : null,
    };
    actions.recordSale(sale);
    if (appliedCoupon) actions.redeemCoupon(appliedCoupon.id);
    ctx.logActivity(emp.name, 'Created sale', 'pos', '#' + sale.id.slice(-6).toUpperCase(), 'success', fmtMoney(total, business.currency) + (discount > 0 ? ', ' + discount + '% discount' : ''));
    setReceipt(sale);
    setCart([]); setDiscount(0); setNote(''); setShowCheckout(false); setAppliedCoupon(null); setCouponCode(''); setRedeemPoints(0); setTableId('');
  };

  const completeSale = async (paymentMethod, splitPayments) => {
    if (discount > CUSTOM_DISCOUNT_THRESHOLD && !canCustomDiscount) {
      const ok = await ctx.requestApproval('pos.discount.custom', discount + '% discount exceeds the ' + CUSTOM_DISCOUNT_THRESHOLD + '% limit for this role.', 'Cart total ' + fmtMoney(total, business.currency));
      if (!ok) { ctx.toast('Sale not completed — approval was not granted.', 'bad'); return; }
    }
    if (!navigator.onLine) {
      actions.queueOfflineSale({ paymentMethod, splitPayments, cart, subtotal, discountAmt: discount > 0 ? discountAmt + couponDiscount + pointsDiscount : couponDiscount + pointsDiscount, discount, tax, total, customerId, note, tableId });
      ctx.toast('You\u2019re offline — sale queued and will sync automatically once back online.', 'warn');
      setCart([]); setDiscount(0); setNote(''); setShowCheckout(false); setAppliedCoupon(null); setCouponCode(''); setRedeemPoints(0); setTableId('');
      return;
    }
    finalizeSale(paymentMethod, splitPayments);
  };

  const handleRefund = async (sale) => {
    if (!canRefund) {
      const ok = await ctx.requestApproval('pos.refund', 'Refund of ' + fmtMoney(sale.total, business.currency) + ' for sale #' + sale.id.slice(-6).toUpperCase(), sale.customerName);
      if (!ok) { ctx.toast('Refund not processed — approval was not granted.', 'bad'); return; }
    }
    actions.refundSale(sale.id);
    ctx.logActivity(currentEmployee?.name, 'Processed refund', 'pos', '#' + sale.id.slice(-6).toUpperCase(), 'success', fmtMoney(sale.total, business.currency));
    ctx.toast('Refund processed — stock restored.', 'good');
  };

  return (
    <div className="flex flex-col lg:flex-row gap-5 -mx-1">
      <div className="flex-1 px-1">
        <div className="flex flex-col sm:flex-row gap-2 mb-4">
          <div className="flex items-center gap-2 bg-paper-raised border border-line rounded-md px-3 py-2 flex-1">
            <IconSearch size={16} className="text-ink-muted" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search or scan barcode…" className="bg-transparent outline-none text-sm w-full" />
          </div>
          {heldOrders.length > 0 && (
            <div className="flex items-center gap-1 overflow-x-auto">
              {heldOrders.map(h => (
                <button key={h.id} onClick={() => resumeOrder(h)} className="shrink-0 text-xs px-2.5 py-2 rounded-md border border-brass text-brass-dark bg-brass-light flex items-center gap-1">
                  <IconClock size={13}/> Resume ({h.cart.length})
                </button>
              ))}
            </div>
          )}
          {canViewHistory && <Button variant="outline" size="md" icon={<IconReceipt size={15}/>} onClick={() => setShowHistory(true)}>Recent sales</Button>}
        </div>
        <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
          {categories.map(c => (
            <button key={c} onClick={() => setCategory(c)} className={'shrink-0 px-3 py-1.5 rounded-full text-sm border ' + (category === c ? 'bg-ink text-paper border-ink' : 'border-line text-ink-muted bg-paper-raised')}>{c}</button>
          ))}
        </div>

                {p.variants && p.variants.length > 0 && <span className="absolute top-2 left-2"><Badge tone="default">Variants</Badge></span>}
                <div className="w-full aspect-square rounded-md bg-paper-dim mb-2 flex items-center justify-center text-ink-muted font-display text-lg">
                  {p.name.split(' ').map(w=>w[0]).slice(0,2).join('')}

                <p className="text-sm font-medium truncate">{p.name}</p>
                <p className="text-xs text-ink-muted tabular">{fmtMoney(p.price, business.currency)} · {avail} {p.unit}</p>

        <div className="bg-paper-raised border border-line rounded-xl flex flex-col sticky top-20 max-h-[calc(100vh-6rem)]">

              <Select label="" value={tableId} onChange={e => setTableId(e.target.value)}
                options={[{ value: '', label: 'No table (counter order)' }, ...tables.map(t => ({ value: t.id, label: t.name }))]} />

          <div className="flex-1 overflow-y-auto px-4 space-y-2 py-2">
            {cart.length === 0 && <p className="text-sm text-ink-muted text-center py-10">Cart is empty. Tap a product to add it.</p>}

              <div key={idx} className="flex items-center gap-2 py-2 border-b border-line last:border-0">
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-medium truncate">{i.name}</p>
                  <p className="text-xs text-ink-muted tabular">{fmtMoney(i.price, business.currency)}</p>
                </div>
                <div className="flex items-center gap-1.5">
                  <button onClick={() => updateQty(idx, -1)} className="w-6 h-6 rounded-full border border-line flex items-center justify-center"><IconMinus size={12}/></button>
                  <span className="w-5 text-center text-sm tabular">{i.qty}</span>
                  <button onClick={() => updateQty(idx, 1)} className="w-6 h-6 rounded-full border border-line flex items-center justify-center"><IconPlus size={12}/></button>
                </div>
                <p className="text-sm font-medium tabular w-16 text-right">{fmtMoney(i.price * i.qty, business.currency)}</p>
                <button onClick={() => removeFromCart(idx)} className="text-ink-muted hover:text-clay"><IconX size={14}/></button>
              </div>
            ))}
          </div>
          <div className="px-4 py-3 border-t border-line space-y-2">
            <div className="flex items-center justify-between text-xs">
              <span className="text-ink-muted">Discount % {!canDiscount && <span className="text-ink-muted/60">(no permission)</span>}</span>
              <input type="number" min="0" max="100" value={discount} disabled={!canDiscount}

            </div>

            {settings.enabledModules.loyalty && (
              <>
                {!appliedCoupon ? (
                  <div className="flex gap-1.5">
                    <input value={couponCode} onChange={e => setCouponCode(e.target.value)} placeholder="Coupon code" className="flex-1 px-2 py-1.5 border border-line rounded text-xs" />
                    <Button size="sm" variant="outline" onClick={applyCoupon} disabled={!couponCode.trim()}>Apply</Button>

                  <div className="flex items-center justify-between text-xs bg-moss-light text-moss px-2 py-1.5 rounded-md">
                    <span>Coupon {appliedCoupon.code} applied</span>
                    <button onClick={() => setAppliedCoupon(null)}><IconX size={13}/></button>

            <div className="flex justify-between text-sm"><span className="text-ink-muted">Subtotal</span><span className="tabular">{fmtMoney(subtotal, business.currency)}</span></div>

            {couponDiscount > 0 && <div className="flex justify-between text-sm"><span className="text-ink-muted">Coupon</span><span className="tabular text-clay">-{fmtMoney(couponDiscount, business.currency)}</span></div>}

            <div className="flex justify-between text-sm"><span className="text-ink-muted">Tax ({business.taxRate}%)</span><span className="tabular">{fmtMoney(tax, business.currency)}</span></div>
            <div className="flex justify-between font-semibold text-base pt-1 border-t border-line"><span>Total</span><span className="tabular">{fmtMoney(total, business.currency)}</span></div>

                <span className="text-xs text-ink-muted tabular">{fmtMoney(variantPicker.price + v.priceDelta, business.currency)} · {v.stock} left</span>

      <Modal open={showCheckout} onClose={() => setShowCheckout(false)} title="Take payment">

      <Modal open={showHistory} onClose={() => setShowHistory(false)} title="Recent sales" width="max-w-2xl">
        <div className="divide-y divide-line max-h-[60vh] overflow-y-auto -mx-5">
          {state.sales.slice(0, 30).map(s => (
            <div key={s.id} className="px-5 py-3 flex items-center gap-3">
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium">#{s.id.slice(-6).toUpperCase()} · {s.customerName}</p>
                <p className="text-xs text-ink-muted">{fmtDateTime(s.date)} · {s.employeeName} · {s.paymentMethod}</p>
              </div>
              <p className="text-sm font-medium tabular">{fmtMoney(s.total, business.currency)}</p>
              {s.status === 'refunded' ? <Badge tone="bad">Refunded</Badge> :
                <Button size="sm" variant="outline" onClick={() => handleRefund(s)}>Refund</Button>}
            </div>
          ))}
          {state.sales.length === 0 && <p className="text-sm text-ink-muted text-center py-8">No sales yet.</p>}
        </div>
      </Modal>

      <Modal open={!!receipt} onClose={() => setReceipt(null)} title="Sale complete" width="max-w-sm"
        footer={<>
          <Button variant="outline" icon={<IconPrint size={15}/>} onClick={() => window.print()}>Print</Button>
          <Button variant="primary" onClick={() => setReceipt(null)}>Done</Button>
        </>}>
        {receipt && <Receipt sale={receipt} business={business} />}
      </Modal>
    </div>
  );
}

function CheckoutForm({ total, currency, paymentMethods, onComplete }) {
  const [mode, setMode] = useState('single');
  const [method, setMethod] = useState(paymentMethods[0]);
  const [splits, setSplits] = useState([{ method: paymentMethods[0], amount: total }]);
  const splitTotal = splits.reduce((a, s) => a + Number(s.amount || 0), 0);
  const remaining = total - splitTotal;

  return (
    <div className="space-y-4">
      <div className="flex justify-between items-baseline">
        <span className="text-sm text-ink-muted">Amount due</span>
        <span className="font-display text-2xl font-semibold tabular">{fmtMoney(total, currency)}</span>
      </div>
      <div className="flex gap-2">
        <button onClick={() => setMode('single')} className={'flex-1 py-2 rounded-md border text-sm ' + (mode === 'single' ? 'border-ink bg-paper-dim' : 'border-line')}>Single payment</button>
        <button onClick={() => setMode('split')} className={'flex-1 py-2 rounded-md border text-sm ' + (mode === 'split' ? 'border-ink bg-paper-dim' : 'border-line')}>Split payment</button>
      </div>
      {mode === 'single' ? (
        <div className="grid grid-cols-2 gap-2">
          {paymentMethods.map(m => (
            <button key={m} onClick={() => setMethod(m)} className={'py-2.5 rounded-md border text-sm ' + (method === m ? 'border-ink bg-paper-dim font-medium' : 'border-line')}>{m}</button>
          ))}
        </div>
      ) : (
        <div className="space-y-2">
          {splits.map((s, i) => (
            <div key={i} className="flex gap-2 items-center">
              <select value={s.method} onChange={e => setSplits(sp => sp.map((x, xi) => xi === i ? { ...x, method: e.target.value } : x))} className="flex-1 px-2 py-2 border border-line rounded-md text-sm">
                {paymentMethods.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
              <input type="number" value={s.amount} onChange={e => setSplits(sp => sp.map((x, xi) => xi === i ? { ...x, amount: e.target.value } : x))} className="w-28 px-2 py-2 border border-line rounded-md text-sm tabular" />
              {splits.length > 1 && <button onClick={() => setSplits(sp => sp.filter((_, xi) => xi !== i))} className="text-ink-muted hover:text-clay"><IconX size={14}/></button>}
            </div>
          ))}
          <button onClick={() => setSplits(sp => [...sp, { method: paymentMethods[0], amount: Math.max(0, remaining) }])} className="text-xs text-brass-dark font-medium flex items-center gap-1"><IconPlus size={12}/> Add payment method</button>
          <p className={'text-xs ' + (Math.abs(remaining) < 0.01 ? 'text-moss' : 'text-clay')}>{Math.abs(remaining) < 0.01 ? 'Fully covered' : (remaining > 0 ? fmtMoney(remaining, currency) + ' remaining' : 'Overpaid by ' + fmtMoney(-remaining, currency))}</p>
        </div>
      )}
      <Button variant="brass" className="w-full" size="lg"
        disabled={mode === 'split' && Math.abs(remaining) > 0.01}
        onClick={() => onComplete(method, mode === 'split' ? splits : null)}>
        Complete sale
      </Button>
    </div>
  );
}

function ProductForm({ initial, categories, suppliers, allProducts, currency, onSave, onCancel, canEditPrice = true, canEditCost = true }) {
  const [f, setF] = useState(initial || { name: '', category: categories[0] || '', sku: '', barcode: '', cost: 0, price: 0, stock: 0, reorderLevel: 5, unit: 'pc', supplierId: suppliers[0]?.id || '', status: 'active', expiryDate: '', variants: [], isComposite: false, components: [] });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  const addVariant = () => setF(x => ({ ...x, variants: [...(x.variants || []), { id: uid('var'), name: '', priceDelta: 0, stock: 0 }] }));
  const updateVariant = (id, patch) => setF(x => ({ ...x, variants: x.variants.map(v => v.id === id ? { ...v, ...patch } : v) }));
  const removeVariant = (id) => setF(x => ({ ...x, variants: x.variants.filter(v => v.id !== id) }));
  const addComponent = () => setF(x => ({ ...x, components: [...(x.components || []), { productId: (allProducts || []).find(p => p.id !== x.id)?.id || '', qty: 1 }] }));
  const updateComponent = (i, patch) => setF(x => ({ ...x, components: x.components.map((c, ci) => ci === i ? { ...c, ...patch } : c) }));
  const removeComponent = (i) => setF(x => ({ ...x, components: x.components.filter((_, ci) => ci !== i) }));
  const componentOptions = (allProducts || []).filter(p => p.id !== f.id && !p.isComposite);

  return (
    <div className="space-y-3">
      <Input label="Product name" value={f.name} onChange={e => set('name', e.target.value)} />
      <div className="grid grid-cols-2 gap-3">
        <Input label="Category" value={f.category} onChange={e => set('category', e.target.value)} list="cat-list" />
        <datalist id="cat-list">{categories.map(c => <option key={c} value={c} />)}</datalist>
        <Select label="Unit" value={f.unit} onChange={e => set('unit', e.target.value)}
          options={['pc','cup','bag','bottle','kg','g','l','ml','box'].map(u => ({ value: u, label: u }))} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Input label="SKU" value={f.sku} onChange={e => set('sku', e.target.value)} />
        <Input label="Barcode" value={f.barcode} onChange={e => set('barcode', e.target.value)} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Input label={'Cost price (' + currency + ')' + (!canEditCost ? ' 🔒' : '')} type="number" step="0.01" value={f.cost} disabled={!canEditCost} className="disabled:bg-paper-dim disabled:text-ink-muted" onChange={e => set('cost', Number(e.target.value))} />
        <Input label={'Selling price (' + currency + ')' + (!canEditPrice ? ' 🔒' : '')} type="number" step="0.01" value={f.price} disabled={!canEditPrice} className="disabled:bg-paper-dim disabled:text-ink-muted" onChange={e => set('price', Number(e.target.value))} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Input label="Stock on hand" type="number" value={f.stock} disabled={f.isComposite} className="disabled:bg-paper-dim disabled:text-ink-muted" onChange={e => set('stock', Number(e.target.value))} hint={f.isComposite ? 'Ignored — this item is a recipe (see below).' : undefined} />
        <Input label="Reorder level" type="number" value={f.reorderLevel} onChange={e => set('reorderLevel', Number(e.target.value))} />
      </div>
      <Input label="Expiry date (optional)" type="date" value={f.expiryDate ? String(f.expiryDate).slice(0,10) : ''} onChange={e => set('expiryDate', e.target.value ? new Date(e.target.value).toISOString() : null)} />
      <Select label="Supplier" value={f.supplierId} onChange={e => set('supplierId', e.target.value)}
        options={[{ value: '', label: 'None' }, ...suppliers.map(s => ({ value: s.id, label: s.name }))]} />

      <div className="pt-2 border-t border-line">
        <div className="flex items-center justify-between mb-2">
          <span className="text-sm font-medium">Variants</span>
          <button type="button" onClick={addVariant} className="text-xs text-brass-dark font-medium flex items-center gap-1"><IconPlus size={12}/> Add variant</button>
        </div>
        <p className="text-xs text-ink-muted mb-2">Optional. e.g. sizes — each variant tracks its own stock and price adjustment.</p>
        {(f.variants || []).map(v => (
          <div key={v.id} className="flex gap-2 items-center mb-1.5">
            <input value={v.name} onChange={e => updateVariant(v.id, { name: e.target.value })} placeholder="Name (e.g. Large)" className="flex-1 px-2 py-1.5 border border-line rounded-md text-sm" />
            <input type="number" step="0.01" value={v.priceDelta} onChange={e => updateVariant(v.id, { priceDelta: Number(e.target.value) })} placeholder="+price" className="w-20 px-2 py-1.5 border border-line rounded-md text-sm tabular" />
            <input type="number" value={v.stock} onChange={e => updateVariant(v.id, { stock: Number(e.target.value) })} placeholder="Stock" className="w-20 px-2 py-1.5 border border-line rounded-md text-sm tabular" />
            <button type="button" onClick={() => removeVariant(v.id)} className="text-ink-muted hover:text-clay"><IconX size={14}/></button>
          </div>
        ))}
      </div>

      <div className="pt-2 border-t border-line">
        <label className="flex items-center gap-2 text-sm font-medium mb-2">
          <input type="checkbox" checked={f.isComposite} onChange={e => set('isComposite', e.target.checked)} className="rounded border-line" />
          This is a recipe / bundle (deducts ingredients instead of its own stock)
        </label>
        {f.isComposite && (
          <div>
            <button type="button" onClick={addComponent} className="text-xs text-brass-dark font-medium flex items-center gap-1 mb-1.5"><IconPlus size={12}/> Add ingredient</button>
            {(f.components || []).map((c, i) => (
              <div key={i} className="flex gap-2 items-center mb-1.5">
                <select value={c.productId} onChange={e => updateComponent(i, { productId: e.target.value })} className="flex-1 px-2 py-1.5 border border-line rounded-md text-sm">
                  {componentOptions.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
                <input type="number" step="0.01" value={c.qty} onChange={e => updateComponent(i, { qty: Number(e.target.value) })} className="w-24 px-2 py-1.5 border border-line rounded-md text-sm tabular" />
                <button type="button" onClick={() => removeComponent(i)} className="text-ink-muted hover:text-clay"><IconX size={14}/></button>
              </div>
            ))}
          </div>
        )}
      </div>

      <ConfirmBar>
        <Button variant="ghost" onClick={onCancel}>Cancel</Button>
        <Button variant="primary" onClick={() => onSave(f)} disabled={!f.name}>Save product</Button>
      </ConfirmBar>
    </div>
  );
}

function Products({ state, actions, ctx }) {
  const { products, suppliers, business, inventoryMovements, roles } = state;
  const currentEmployee = ctx.currentEmployee;
  const canCreate = can(currentEmployee, roles, 'products.create');
  const canEdit = can(currentEmployee, roles, 'products.edit');
  const canDelete = can(currentEmployee, roles, 'products.delete');
  const canEditPrice = can(currentEmployee, roles, 'products.price.edit');
  const canEditCost = can(currentEmployee, roles, 'products.cost.edit');
  const canAdjustStock = can(currentEmployee, roles, 'inventory.adjust');
  const [tab, setTab] = useState('products');
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null); // {mode:'add'|'edit', product}
  const [movementFor, setMovementFor] = useState(null);
  const [adjust, setAdjust] = useState(null);

  const categories = Array.from(new Set(products.map(p => p.category)));
  const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase()));
  const lowStock = products.filter(p => !p.isComposite && p.stock <= p.reorderLevel);
  const expired = products.filter(p => p.expiryDate && new Date(p.expiryDate) < new Date());
  const expiringSoon = products.filter(p => p.expiryDate && new Date(p.expiryDate) >= new Date() && new Date(p.expiryDate) < new Date(Date.now() + 3 * 86400000));
  const inventoryValue = products.reduce((a, p) => a + (p.isComposite ? 0 : p.stock * p.cost), 0);

  const handleDelete = async (p) => {
    if (!canDelete) {
      const ok = await ctx.requestApproval('products.delete', 'Delete product "' + p.name + '"', p.name);
      if (!ok) { ctx.toast('Product not deleted — approval was not granted.', 'bad'); return; }
    }
    actions.deleteProduct(p.id);
    ctx.logActivity(currentEmployee?.name, 'Deleted product', 'products', p.name, 'success', '');
    ctx.toast('Product removed.', 'good');
  };

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="flex gap-1 bg-paper-dim rounded-lg p-1">
          {[['products','Products'],['alerts','Stock Alerts ('+lowStock.length+')'],['movements','Movement History']].map(([k,l]) => (
            <button key={k} onClick={() => setTab(k)} className={'px-3 py-1.5 rounded-md text-sm ' + (tab===k ? 'bg-paper-raised shadow-sm font-medium' : 'text-ink-muted')}>{l}</button>
          ))}
        </div>
        {tab === 'products' && canCreate && <Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setModal({ mode: 'add' })}>Add product</Button>}
      </div>

      {tab === 'products' && (
        <Card padded={false}>
          <div className="p-4 border-b border-line flex items-center justify-between gap-3">
            <div className="flex items-center gap-2 bg-paper-raised border border-line rounded-md px-3 py-1.5 flex-1 max-w-xs">
              <IconSearch size={14} className="text-ink-muted" />
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search products…" className="bg-transparent outline-none text-sm w-full" />
            </div>
            <div className="text-xs text-ink-muted">Inventory value: <span className="font-semibold text-ink tabular">{fmtMoney(inventoryValue, business.currency)}</span></div>
          </div>
          {filtered.length === 0 ? <EmptyState icon={<IconBox size={22}/>} title="No products yet" message="Add your first product to start tracking inventory and selling in the POS." action={<Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setModal({ mode: 'add' })}>Add product</Button>} /> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-xs text-ink-muted border-b border-line">
                <th className="px-4 py-2.5 font-medium">Product</th><th className="px-2 py-2.5 font-medium">Category</th>
                <th className="px-2 py-2.5 font-medium">Cost</th><th className="px-2 py-2.5 font-medium">Price</th>
                <th className="px-2 py-2.5 font-medium">Stock</th><th className="px-2 py-2.5 font-medium">Status</th>
                <th className="px-4 py-2.5 font-medium text-right">Actions</th>
              </tr></thead>
              <tbody>
                {filtered.map(p => (
                  <tr key={p.id} className="border-b border-line last:border-0 hover:bg-paper-dim/50">
                    <td className="px-4 py-2.5"><p className="font-medium">{p.name}</p><p className="text-xs text-ink-muted">{p.sku}</p></td>
                    <td className="px-2 py-2.5 text-ink-muted">{p.category}</td>
                    <td className="px-2 py-2.5 tabular">{fmtMoney(p.cost, business.currency)}</td>
                    <td className="px-2 py-2.5 tabular font-medium">{fmtMoney(p.price, business.currency)}</td>
                    <td className="px-2 py-2.5 tabular">{p.stock} {p.unit}</td>
                    <td className="px-2 py-2.5">{p.stock <= 0 ? <Badge tone="bad">Out of stock</Badge> : p.stock <= p.reorderLevel ? <Badge tone="warn">Low</Badge> : <Badge tone="good">In stock</Badge>}</td>
                    <td className="px-4 py-2.5">
                      <div className="flex justify-end gap-1">
                        {canAdjustStock && <button onClick={() => setAdjust(p)} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted" title="Adjust stock"><IconLayers size={14}/></button>}
                        {canEdit && <button onClick={() => setModal({ mode: 'edit', product: p })} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted" title="Edit"><IconEdit size={14}/></button>}
                        <button onClick={() => handleDelete(p)} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted" title="Delete"><IconTrash size={14}/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          )}
        </Card>
      )}

      {tab === 'alerts' && (
        <div className="space-y-5">
          <Card padded={false} title="Low & out of stock">
            {lowStock.length === 0 ? <p className="text-sm text-ink-muted text-center py-6">No products are currently below their reorder level.</p> : (
              <table className="w-full text-sm">
                <thead><tr className="text-left text-xs text-ink-muted border-b border-line"><th className="px-4 py-2.5 font-medium">Product</th><th className="px-2 py-2.5 font-medium">Current stock</th><th className="px-2 py-2.5 font-medium">Reorder level</th><th className="px-4 py-2.5 font-medium">Status</th></tr></thead>
                <tbody>{lowStock.map(p => (
                  <tr key={p.id} className="border-b border-line last:border-0">
                    <td className="px-4 py-2.5 font-medium">{p.name}</td>
                    <td className="px-2 py-2.5 tabular">{p.stock} {p.unit}</td>
                    <td className="px-2 py-2.5 tabular text-ink-muted">{p.reorderLevel} {p.unit}</td>
                    <td className="px-4 py-2.5">{p.stock <= 0 ? <Badge tone="bad">Out of stock</Badge> : <Badge tone="warn">Reorder soon</Badge>}</td>
                  </tr>
                ))}</tbody>
              </table>
            )}
          </Card>
          {(expired.length > 0 || expiringSoon.length > 0) && (
            <Card padded={false} title="Expiring & expired">
              <table className="w-full text-sm">
                <thead><tr className="text-left text-xs text-ink-muted border-b border-line"><th className="px-4 py-2.5 font-medium">Product</th><th className="px-2 py-2.5 font-medium">Expiry date</th><th className="px-4 py-2.5 font-medium">Status</th></tr></thead>
                <tbody>
                  {expired.map(p => (
                    <tr key={p.id} className="border-b border-line last:border-0">
                      <td className="px-4 py-2.5 font-medium">{p.name}</td><td className="px-2 py-2.5">{fmtDate(p.expiryDate)}</td><td className="px-4 py-2.5"><Badge tone="bad">Expired</Badge></td>
                    </tr>
                  ))}
                  {expiringSoon.map(p => (
                    <tr key={p.id} className="border-b border-line last:border-0">
                      <td className="px-4 py-2.5 font-medium">{p.name}</td><td className="px-2 py-2.5">{fmtDate(p.expiryDate)}</td><td className="px-4 py-2.5"><Badge tone="warn">Expiring soon</Badge></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Card>
          )}
        </div>
      )}

      {tab === 'movements' && (
        <Card padded={false}>
          {inventoryMovements.length === 0 ? <EmptyState icon={<IconLayers size={22}/>} title="No movement yet" message="Stock changes from sales, purchases, and manual adjustments will be logged here." /> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-xs text-ink-muted border-b border-line"><th className="px-4 py-2.5 font-medium">Date</th><th className="px-2 py-2.5 font-medium">Product</th><th className="px-2 py-2.5 font-medium">Type</th><th className="px-2 py-2.5 font-medium">Change</th><th className="px-2 py-2.5 font-medium">New qty</th><th className="px-4 py-2.5 font-medium">Reason</th></tr></thead>
              <tbody>{inventoryMovements.slice(0, 100).map(m => (
                <tr key={m.id} className="border-b border-line last:border-0">
                  <td className="px-4 py-2.5 text-ink-muted whitespace-nowrap">{fmtDateTime(m.date)}</td>
                  <td className="px-2 py-2.5">{m.productName}</td>
                  <td className="px-2 py-2.5"><Badge tone={m.type === 'sale' ? 'default' : m.type === 'purchase' ? 'good' : 'warn'}>{m.type}</Badge></td>
                  <td className={'px-2 py-2.5 tabular font-medium ' + (m.qtyChange < 0 ? 'text-clay' : 'text-moss')}>{m.qtyChange > 0 ? '+' : ''}{m.qtyChange}</td>
                  <td className="px-2 py-2.5 tabular">{m.newQty}</td>
                  <td className="px-4 py-2.5 text-ink-muted">{m.reason}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
          )}
        </Card>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Edit product' : 'Add product'}>
        {modal && <ProductForm initial={modal.product} categories={categories} suppliers={suppliers} allProducts={products} currency={business.currency}
          canEditPrice={canEditPrice} canEditCost={canEditCost}
          onCancel={() => setModal(null)}
          onSave={(f) => {
            let diffNote = '';
            if (modal.mode === 'edit') {
              const before = modal.product;
              const changes = [];
              if (before.price !== f.price) changes.push('price ' + fmtMoney(before.price, business.currency) + ' → ' + fmtMoney(f.price, business.currency));
              if (before.cost !== f.cost) changes.push('cost ' + fmtMoney(before.cost, business.currency) + ' → ' + fmtMoney(f.cost, business.currency));
              diffNote = changes.join(', ');
              actions.updateProduct(f);
            } else {
              actions.addProduct(f);
            }
            setModal(null);
            ctx.logActivity(currentEmployee?.name, modal.mode === 'edit' ? 'Edited product' : 'Created product', 'products', f.name, 'success', diffNote);
            ctx.toast('Product saved.', 'good');
          }} />}
      </Modal>

      <Modal open={!!adjust} onClose={() => setAdjust(null)} title={'Adjust stock — ' + (adjust?.name || '')} width="max-w-sm">
        {adjust && <AdjustStockForm product={adjust} onCancel={() => setAdjust(null)} onSave={(qty, reason) => { actions.adjustStock(adjust.id, qty, reason); setAdjust(null); ctx.toast('Stock adjusted.', 'good'); }} />}
      </Modal>
    </div>
  );
}

function AdjustStockForm({ product, onCancel, onSave }) {
  const [qty, setQty] = useState(0);
  const [reason, setReason] = useState('Stock count correction');
  return (
    <div className="space-y-3">
      <p className="text-sm text-ink-muted">Current stock: <span className="font-medium text-ink tabular">{product.stock} {product.unit}</span></p>
      <Input label="Quantity change" type="number" value={qty} onChange={e => setQty(Number(e.target.value))} hint="Use a negative number to reduce stock (e.g. damage, shrinkage)." />
      <Select label="Reason" value={reason} onChange={e => setReason(e.target.value)} options={['Stock count correction','Damaged goods','Theft / shrinkage','Expired product','Other'].map(r => ({ value: r, label: r }))} />
      <ConfirmBar>
        <Button variant="ghost" onClick={onCancel}>Cancel</Button>
        <Button variant="primary" onClick={() => onSave(qty, reason)} disabled={qty === 0}>Apply adjustment</Button>
      </ConfirmBar>
    </div>
  );
}

          {[['purchases','Purchase Orders'],['suppliers','Suppliers']].map(([k,l]) => (
            <button key={k} onClick={() => setTab(k)} className={'px-3 py-1.5 rounded-md text-sm ' + (tab===k ? 'bg-paper-raised shadow-sm font-medium' : 'text-ink-muted')}>{l}</button>
          ))}

        {tab === 'purchases' ? <Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setPoModal(true)}>New purchase order</Button>

      </div>

      {tab === 'purchases' && (
        <Card padded={false}>
          {purchases.length === 0 ? <EmptyState icon={<IconTruck size={22}/>} title="No purchase orders yet" message="Create a purchase order to restock from your suppliers." action={<Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setPoModal(true)}>New purchase order</Button>} /> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-xs text-ink-muted border-b border-line"><th className="px-4 py-2.5 font-medium">Date</th><th className="px-2 py-2.5 font-medium">Supplier</th><th className="px-2 py-2.5 font-medium">Items</th><th className="px-2 py-2.5 font-medium">Total</th><th className="px-2 py-2.5 font-medium">Status</th><th className="px-4 py-2.5 font-medium text-right">Action</th></tr></thead>
              <tbody>{purchases.map(po => (
                <tr key={po.id} className="border-b border-line last:border-0">
                  <td className="px-4 py-2.5 text-ink-muted whitespace-nowrap">{fmtDate(po.date)}</td>
                  <td className="px-2 py-2.5">{po.supplierName}</td>
                  <td className="px-2 py-2.5 text-ink-muted">{po.items.length} line{po.items.length !== 1 ? 's' : ''}</td>
                  <td className="px-2 py-2.5 tabular font-medium">{fmtMoney(po.total, business.currency)}</td>
                  <td className="px-2 py-2.5">{po.status === 'received' ? <Badge tone="good">Received</Badge> : <Badge tone="warn">Pending</Badge>}</td>
                  <td className="px-4 py-2.5 text-right">
                    {po.status === 'pending' && <Button size="sm" variant="outline" onClick={() => { actions.receivePurchase(po.id); ctx.toast('Purchase received — stock updated.', 'good'); }}>Mark received</Button>}

                </tr>
              ))}</tbody>
            </table>
          </div>
          )}
        </Card>
      )}

      {tab === 'suppliers' && (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {suppliers.length === 0 && <div className="col-span-full"><EmptyState icon={<IconTruck size={22}/>} title="No suppliers yet" message="Add suppliers to track purchases and outstanding balances." action={<Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setSupModal({ mode: 'add' })}>Add supplier</Button>} /></div>}
          {suppliers.map(s => {
            const supPurchases = purchases.filter(p => p.supplierId === s.id);
            return (
              <Card key={s.id}>
                <div className="flex items-start justify-between mb-2">
                  <div>
                    <p className="font-medium">{s.name}</p>
                    <p className="text-xs text-ink-muted">{s.contact}</p>
                  </div>
                  <button onClick={() => setSupModal({ mode: 'edit', supplier: s })} className="text-ink-muted hover:text-ink"><IconEdit size={14}/></button>
                </div>
                <p className="text-xs text-ink-muted">{s.phone}</p>
                <p className="text-xs text-ink-muted mb-3">{s.email}</p>
                <div className="flex justify-between text-sm pt-2 border-t border-line">
                  <span className="text-ink-muted">Purchases</span><span className="tabular font-medium">{supPurchases.length}</span>
                </div>
                <div className="flex justify-between text-sm">
                  <span className="text-ink-muted">Outstanding balance</span>
                  <span className={'tabular font-medium ' + (s.balance > 0 ? 'text-clay' : '')}>{fmtMoney(s.balance, business.currency)}</span>

              </Card>

          })}

      <Modal open={poModal} onClose={() => setPoModal(false)} title="New purchase order" width="max-w-lg">
        <PurchaseOrderForm suppliers={suppliers} products={products} currency={business.currency}
          onCancel={() => setPoModal(false)}
          onSave={(po) => { actions.addPurchase(po); setPoModal(false); ctx.toast('Purchase order created.', 'good'); }} />

      <Modal open={!!supModal} onClose={() => setSupModal(null)} title={supModal?.mode === 'edit' ? 'Edit supplier' : 'Add supplier'} width="max-w-md">

function SupplierForm({ initial, onCancel, onSave }) {
  const [f, setF] = useState(initial || { name: '', contact: '', phone: '', email: '', balance: 0 });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  return (

        <Input label="Phone" value={f.phone} onChange={e => set('phone', e.target.value)} />
        <Input label="Email" value={f.email} onChange={e => set('email', e.target.value)} />
      </div>
      <ConfirmBar>
        <Button variant="ghost" onClick={onCancel}>Cancel</Button>
        <Button variant="primary" onClick={() => onSave(f)} disabled={!f.name}>Save supplier</Button>
      </ConfirmBar>
    </div>
  );
}

function PurchaseOrderForm({ suppliers, products, currency, onCancel, onSave }) {
  const [supplierId, setSupplierId] = useState(suppliers[0]?.id || '');
  const [items, setItems] = useState([{ productId: products[0]?.id || '', qty: 10 }]);
  const total = items.reduce((a, it) => {
    const p = products.find(pp => pp.id === it.productId);
    return a + (p ? p.cost * it.qty : 0);
  }, 0);
  return (
    <div className="space-y-3">
      <Select label="Supplier" value={supplierId} onChange={e => setSupplierId(e.target.value)} options={suppliers.map(s => ({ value: s.id, label: s.name }))} />
      <div className="space-y-2">
        <span className="block text-xs font-medium text-ink-muted">Items</span>
        {items.map((it, i) => (
          <div key={i} className="flex gap-2 items-center">
            <select value={it.productId} onChange={e => setItems(is => is.map((x, xi) => xi === i ? { ...x, productId: e.target.value } : x))} className="flex-1 px-2 py-2 border border-line rounded-md text-sm">
              {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            <input type="number" value={it.qty} onChange={e => setItems(is => is.map((x, xi) => xi === i ? { ...x, qty: Number(e.target.value) } : x))} className="w-20 px-2 py-2 border border-line rounded-md text-sm tabular" />
            {items.length > 1 && <button onClick={() => setItems(is => is.filter((_, xi) => xi !== i))} className="text-ink-muted hover:text-clay"><IconX size={14}/></button>}
          </div>
        ))}
        <button onClick={() => setItems(is => [...is, { productId: products[0]?.id || '', qty: 10 }])} className="text-xs text-brass-dark font-medium flex items-center gap-1"><IconPlus size={12}/> Add line item</button>
      </div>
      <div className="flex justify-between text-sm pt-2 border-t border-line"><span className="text-ink-muted">Estimated total</span><span className="font-medium tabular">{fmtMoney(total, currency)}</span></div>
      <ConfirmBar>
        <Button variant="ghost" onClick={onCancel}>Cancel</Button>
        <Button variant="primary" disabled={!supplierId || !items.length} onClick={() => {
          const supplier = suppliers.find(s => s.id === supplierId);
          onSave({
            id: uid('po'), date: new Date().toISOString(), supplierId, supplierName: supplier.name, status: 'pending',
            items: items.map(it => { const p = products.find(pp => pp.id === it.productId); return { productId: it.productId, name: p.name, qty: it.qty, cost: p.cost }; }),
            total,
          });
        }}>Create order</Button>
      </ConfirmBar>
    </div>
  );
}

function Customers({ state, actions, ctx }) {
  const { customers, sales, business } = state;
  const [search, setSearch] = useState('');

  const [viewing, setViewing] = useState(null);

    <div>

          <IconSearch size={14} className="text-ink-muted" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search customers…" className="bg-transparent outline-none text-sm w-full" />
        </div>
        <Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setModal({ mode: 'add' })}>Add customer</Button>
      </div>
      <Card padded={false}>
        {filtered.length === 0 ? <EmptyState icon={<IconUsers size={22}/>} title="No customers yet" message="Add customers to track their purchase history and build loyalty." action={<Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setModal({ mode: 'add' })}>Add customer</Button>} /> : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-xs text-ink-muted border-b border-line"><th className="px-4 py-2.5 font-medium">Name</th><th className="px-2 py-2.5 font-medium">Phone</th><th className="px-2 py-2.5 font-medium">Total spent</th><th className="px-2 py-2.5 font-medium">Orders</th><th className="px-4 py-2.5 font-medium text-right">Actions</th></tr></thead>
            <tbody>{filtered.map(c => {
              const orders = sales.filter(s => s.customerId === c.id).length;
              return (
                <tr key={c.id} className="border-b border-line last:border-0 hover:bg-paper-dim/50 cursor-pointer" onClick={() => setViewing(c)}>
                  <td className="px-4 py-2.5 font-medium">{c.name}</td>
                  <td className="px-2 py-2.5 text-ink-muted">{c.phone || '—'}</td>
                  <td className="px-2 py-2.5 tabular">{fmtMoney(c.totalSpent, business.currency)}</td>
                  <td className="px-2 py-2.5 tabular">{orders}</td>
                  <td className="px-4 py-2.5 text-right" onClick={e => e.stopPropagation()}>
                    <div className="flex justify-end gap-1">
                      <button onClick={() => setModal({ mode: 'edit', customer: c })} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted"><IconEdit size={14}/></button>
                      {!c.isWalkIn && <button onClick={() => { actions.deleteCustomer(c.id); ctx.toast('Customer removed.', 'good'); }} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted"><IconTrash size={14}/></button>}
                    </div>
                  </td>
                </tr>
              );
            })}</tbody>
          </table>
        </div>
        )}
      </Card>

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal?.mode === 'edit' ? 'Edit customer' : 'Add customer'} width="max-w-md">
        {modal && <CustomerForm initial={modal.customer} onCancel={() => setModal(null)}
          onSave={(c) => { modal.mode === 'edit' ? actions.updateCustomer(c) : actions.addCustomer(c); setModal(null); ctx.toast('Customer saved.', 'good'); }} />}
      </Modal>

      <Modal open={!!viewing} onClose={() => setViewing(null)} title={viewing?.name || ''} width="max-w-lg">
        {viewing && (
          <div>
            <div className="grid grid-cols-2 gap-3 mb-4 text-sm">
              <div><p className="text-ink-muted text-xs">Phone</p><p>{viewing.phone || '—'}</p></div>
              <div><p className="text-ink-muted text-xs">Email</p><p>{viewing.email || '—'}</p></div>
              <div><p className="text-ink-muted text-xs">Total spent</p><p className="font-medium tabular">{fmtMoney(viewing.totalSpent, business.currency)}</p></div>
              <div><p className="text-ink-muted text-xs">Customer since</p><p>{fmtDate(viewing.joined)}</p></div>
            </div>
            <p className="text-xs font-semibold text-ink-muted mb-2">Purchase history</p>
            <div className="border border-line rounded-lg divide-y divide-line max-h-64 overflow-y-auto">
              {sales.filter(s => s.customerId === viewing.id).map(s => (
                <div key={s.id} className="px-3 py-2 flex justify-between text-sm">
                  <span className="text-ink-muted">{fmtDateTime(s.date)}</span>
                  <span className="tabular font-medium">{fmtMoney(s.total, business.currency)}</span>
                </div>
              ))}
              {sales.filter(s => s.customerId === viewing.id).length === 0 && <p className="text-sm text-ink-muted px-3 py-4 text-center">No purchases yet.</p>}
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

function CustomerForm({ initial, onCancel, onSave }) {
  const [f, setF] = useState(initial || { name: '', phone: '', email: '', totalSpent: 0, balance: 0, joined: new Date().toISOString() });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  return (
    <div className="space-y-3">
      <Input label="Full name" value={f.name} onChange={e => set('name', e.target.value)} />
      <div className="grid grid-cols-2 gap-3">
        <Input label="Phone" value={f.phone} onChange={e => set('phone', e.target.value)} />
        <Input label="Email" value={f.email} onChange={e => set('email', e.target.value)} />
      </div>
      <ConfirmBar>
        <Button variant="ghost" onClick={onCancel}>Cancel</Button>
        <Button variant="primary" onClick={() => onSave(f)} disabled={!f.name}>Save customer</Button>
      </ConfirmBar>
    </div>
  );
}

/* ============================== CASH REGISTER ============================== */

function CashRegister({ state, actions, ctx }) {
  const { registerSessions, sales, roles, business, branches } = state;
  const currentEmployee = ctx.currentEmployee;
  const canOpen = can(currentEmployee, roles, 'register.open');
  const canClose = can(currentEmployee, roles, 'register.close');
  const canMove = can(currentEmployee, roles, 'register.cash_movement');
  const openSession = registerSessions.find(s => s.status === 'open');
  const [openModal, setOpenModal] = useState(false);
  const [closeModal, setCloseModal] = useState(false);
  const [moveModal, setMoveModal] = useState(null); // 'in' | 'out'

  const cashSalesSince = openSession ? sales.filter(s => new Date(s.date) >= new Date(openSession.openedAt) && s.paymentMethod === 'Cash' && s.status !== 'refunded') : [];
  const cashRefundsSince = openSession ? sales.filter(s => new Date(s.date) >= new Date(openSession.openedAt) && s.paymentMethod === 'Cash' && s.status === 'refunded') : [];
  const cashInTotal = openSession ? openSession.cashIn.reduce((a, c) => a + c.amount, 0) : 0;
  const cashOutTotal = openSession ? openSession.cashOut.reduce((a, c) => a + c.amount, 0) : 0;
  const expected = openSession ? openSession.openingBalance + cashSalesSince.reduce((a, s) => a + s.total, 0) - cashRefundsSince.reduce((a, s) => a + s.total, 0) + cashInTotal - cashOutTotal : 0;

  const closedSessions = registerSessions.filter(s => s.status === 'closed').sort((a, b) => new Date(b.closedAt) - new Date(a.closedAt));

  return (
    <div className="space-y-5">
      {!openSession ? (
        <Card>
          <EmptyState icon={<IconRegister size={22}/>} title="No register session is open" message="Open a session with a starting cash float before taking cash payments."
            action={canOpen ? <Button variant="primary" onClick={() => setOpenModal(true)}>Open register</Button> : <p className="text-xs text-ink-muted">You don't have permission to open the register.</p>} />
        </Card>
      ) : (
        <>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard label="Opening float" value={fmtMoney(openSession.openingBalance, business.currency)} sub={'Opened ' + fmtDateTime(openSession.openedAt) + ' by ' + openSession.openedBy} />
            <StatCard label="Cash sales this session" value={fmtMoney(cashSalesSince.reduce((a,s)=>a+s.total,0), business.currency)} sub={cashSalesSince.length + ' transactions'} />
            <StatCard label="Cash in / out" value={fmtMoney(cashInTotal - cashOutTotal, business.currency)} sub={fmtMoney(cashInTotal, business.currency) + ' in, ' + fmtMoney(cashOutTotal, business.currency) + ' out'} />
            <StatCard label="Expected in drawer" value={fmtMoney(expected, business.currency)} />
          </div>
          <div className="flex flex-wrap gap-2">
            {canMove && <Button variant="outline" icon={<IconPlus size={15}/>} onClick={() => setMoveModal('in')}>Cash in</Button>}
            {canMove && <Button variant="outline" icon={<IconMinus size={15}/>} onClick={() => setMoveModal('out')}>Cash out</Button>}
            {canClose && <Button variant="brass" onClick={() => setCloseModal(true)}>Close register</Button>}
          </div>
          <Card title="Cash movements this session" padded={false}>
            {openSession.cashIn.length === 0 && openSession.cashOut.length === 0 ? (
              <p className="text-sm text-ink-muted text-center py-6">No manual cash movements yet.</p>
            ) : (
              <div className="divide-y divide-line">
                {[...openSession.cashIn.map(c => ({ ...c, dir: 'in' })), ...openSession.cashOut.map(c => ({ ...c, dir: 'out' }))]
                  .sort((a, b) => new Date(b.date) - new Date(a.date))
                  .map((c, i) => (
                    <div key={i} className="px-5 py-2.5 flex items-center justify-between text-sm">
                      <span>{c.note || (c.dir === 'in' ? 'Cash in' : 'Cash out')}</span>
                      <span className={'font-medium tabular ' + (c.dir === 'in' ? 'text-moss' : 'text-clay')}>{c.dir === 'in' ? '+' : '-'}{fmtMoney(c.amount, business.currency)}</span>
                    </div>
                  ))}
              </div>
            )}
          </Card>
        </>
      )}

      <Card title="Past sessions" padded={false}>
        {closedSessions.length === 0 ? <p className="text-sm text-ink-muted text-center py-6">No closed sessions yet.</p> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="text-left text-xs text-ink-muted border-b border-line"><th className="px-5 py-2.5 font-medium">Closed</th><th className="px-2 py-2.5 font-medium">Opened by</th><th className="px-2 py-2.5 font-medium">Expected</th><th className="px-2 py-2.5 font-medium">Actual</th><th className="px-5 py-2.5 font-medium text-right">Variance</th></tr></thead>
              <tbody>{closedSessions.map(s => (
                <tr key={s.id} className="border-b border-line last:border-0">
                  <td className="px-5 py-2.5 text-ink-muted whitespace-nowrap">{fmtDateTime(s.closedAt)}</td>
                  <td className="px-2 py-2.5">{s.openedBy}</td>
                  <td className="px-2 py-2.5 tabular">{fmtMoney(s.expectedClosingBalance, business.currency)}</td>
                  <td className="px-2 py-2.5 tabular">{fmtMoney(s.actualClosingBalance, business.currency)}</td>
                  <td className={'px-5 py-2.5 text-right tabular font-medium ' + (Math.abs(s.variance) < 0.01 ? '' : s.variance < 0 ? 'text-clay' : 'text-moss')}>
                    {s.variance > 0 ? '+' : ''}{fmtMoney(s.variance, business.currency)}
                  </td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        )}
      </Card>

      <Modal open={openModal} onClose={() => setOpenModal(false)} title="Open register" width="max-w-sm">
        <OpenRegisterForm onCancel={() => setOpenModal(false)} onSave={(bal) => {
          actions.openRegister(bal, currentEmployee?.name);
          ctx.logActivity(currentEmployee?.name, 'Opened register', 'register', 'Session', 'success', 'Opening float ' + fmtMoney(bal, business.currency));
          setOpenModal(false); ctx.toast('Register opened.', 'good');
        }} currency={business.currency} />
      </Modal>

      <Modal open={!!moveModal} onClose={() => setMoveModal(null)} title={moveModal === 'in' ? 'Cash in' : 'Cash out'} width="max-w-sm">
        <CashMovementForm onCancel={() => setMoveModal(null)} onSave={(amount, note) => {
          actions.addCashMovement(moveModal, amount, note);
          ctx.logActivity(currentEmployee?.name, moveModal === 'in' ? 'Recorded cash in' : 'Recorded cash out', 'register', note || '', 'success', fmtMoney(amount, business.currency));
          setMoveModal(null); ctx.toast('Recorded.', 'good');
        }} />
      </Modal>

      <Modal open={closeModal} onClose={() => setCloseModal(false)} title="Close register" width="max-w-sm">
        <CloseRegisterForm expected={expected} currency={business.currency} onCancel={() => setCloseModal(false)} onSave={(actual) => {
          actions.closeRegister(actual, expected, currentEmployee?.name);
          ctx.logActivity(currentEmployee?.name, 'Closed register', 'register', 'Session', 'success', 'Variance ' + fmtMoney(actual - expected, business.currency));
          setCloseModal(false); ctx.toast('Register closed.', 'good');
        }} />
      </Modal>
    </div>
  );
}

function OpenRegisterForm({ onCancel, onSave, currency }) {
  const [bal, setBal] = useState(0);
  return (
    <div className="space-y-3">
      <Input label={'Opening float (' + currency + ')'} type="number" step="0.01" value={bal} onChange={e => setBal(Number(e.target.value))} autoFocus />
      <ConfirmBar><Button variant="ghost" onClick={onCancel}>Cancel</Button><Button variant="primary" onClick={() => onSave(bal)}>Open</Button></ConfirmBar>
    </div>
  );
}
function CashMovementForm({ onCancel, onSave }) {
  const [amount, setAmount] = useState(0);
  const [note, setNote] = useState('');
  return (
    <div className="space-y-3">
      <Input label="Amount" type="number" step="0.01" value={amount} onChange={e => setAmount(Number(e.target.value))} autoFocus />
      <Input label="Note" value={note} onChange={e => setNote(e.target.value)} placeholder="e.g. Petty cash, change float top-up" />
      <ConfirmBar><Button variant="ghost" onClick={onCancel}>Cancel</Button><Button variant="primary" disabled={!amount} onClick={() => onSave(amount, note)}>Save</Button></ConfirmBar>
    </div>
  );
}
function CloseRegisterForm({ expected, currency, onCancel, onSave }) {
  const [actual, setActual] = useState(expected.toFixed(2));
  const variance = Number(actual || 0) - expected;
  return (
    <div className="space-y-3">
      <p className="text-sm text-ink-muted">Expected in drawer: <span className="font-medium text-ink tabular">{fmtMoney(expected, currency)}</span></p>
      <Input label="Counted amount" type="number" step="0.01" value={actual} onChange={e => setActual(e.target.value)} autoFocus />
      <p className={'text-sm ' + (Math.abs(variance) < 0.01 ? 'text-moss' : 'text-clay')}>
        {Math.abs(variance) < 0.01 ? 'Balances exactly.' : (variance > 0 ? 'Over by ' : 'Short by ') + fmtMoney(Math.abs(variance), currency)}
      </p>
      <ConfirmBar><Button variant="ghost" onClick={onCancel}>Cancel</Button><Button variant="brass" onClick={() => onSave(Number(actual))}>Close register</Button></ConfirmBar>
    </div>
  );
}
