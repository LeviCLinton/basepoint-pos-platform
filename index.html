function StatusBadge({ status }) {
  if (status === 'active') return <Badge tone="good">Active</Badge>;
  if (status === 'suspended') return <Badge tone="warn">Suspended</Badge>;
  return <Badge tone="bad">Deactivated</Badge>;
}

/** Grouped, plain-language permission checklist. Shared by role editing and per-employee special access. */
function PermissionChecklist({ selected, onToggle, disabledIds = [], search = '' }) {
  const q = search.toLowerCase();
  return (
    <div className="space-y-4 max-h-80 overflow-y-auto pr-1">
      {PERMISSION_CATALOG.map(cat => {
        const items = cat.permissions.filter(p => !q || p.label.toLowerCase().includes(q) || cat.categoryLabel.toLowerCase().includes(q));
        if (!items.length) return null;
        return (
          <div key={cat.category}>
            <p className="text-xs font-semibold text-ink-muted mb-1.5">{cat.categoryLabel}</p>
            <div className="grid sm:grid-cols-2 gap-1.5">
              {items.map(p => {
                const checked = selected.includes(p.id);
                const locked = disabledIds.includes(p.id);
                return (
                  <label key={p.id} className={'flex items-center gap-2 text-sm px-2 py-1.5 rounded-md ' + (locked ? 'opacity-50' : 'hover:bg-paper-dim cursor-pointer')}>
                    <input type="checkbox" checked={checked} disabled={locked} onChange={() => onToggle(p.id)} className="rounded border-line" />
                    <span>{p.label}</span>
                  </label>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function ManagerApprovalModal({ approval, employees, roles, onApprove, onCancel, onFailedAttempt }) {
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [checking, setChecking] = useState(false);
  if (!approval) return null;
  const approvers = findApprovers(employees, roles, approval.permissionId, approval.requesterId);

  const submit = async () => {
    setChecking(true); setError('');
    const hash = await hashPin(pin);
    const match = approvers.find(a => a.pinHash === hash);
    setChecking(false);
    if (match) { onApprove(match); setPin(''); }
    else { setError('Incorrect PIN. Ask a manager to enter theirs.'); setPin(''); onFailedAttempt && onFailedAttempt(); }
  };

  return (
    <Modal open={true} onClose={onCancel} title="Manager approval required" width="max-w-sm">
      <div className="space-y-3">
        <div className="flex items-start gap-2.5 bg-brass-light text-brass-dark rounded-lg p-3 text-sm">
          <IconLock size={16} className="mt-0.5 shrink-0" />
          <div>
            <p className="font-medium">{permLabel(approval.permissionId)}</p>
            <p className="text-xs mt-0.5">{approval.description}</p>
          </div>
        </div>
        {approvers.length === 0 ? (
          <p className="text-sm text-ink-muted">No active employee currently holds this permission, so it can't be approved right now.</p>
        ) : (
          <>
            <Input label="Manager PIN" type="password" inputMode="numeric" value={pin} onChange={e => setPin(e.target.value)} autoFocus
              onKeyDown={e => e.key === 'Enter' && pin && submit()} />
            {error && <p className="text-xs text-clay">{error}</p>}
          </>
        )}
        <ConfirmBar>
          <Button variant="ghost" onClick={onCancel}>Cancel</Button>
          {approvers.length > 0 && <Button variant="brass" disabled={!pin || checking} onClick={submit}>{checking ? 'Checking…' : 'Approve'}</Button>}
        </ConfirmBar>
      </div>
    </Modal>
  );
}

/* ============================== EMPLOYEES ============================== */

const EMPLOYEE_WIZARD_STEPS = ['Details', 'Department', 'Role', 'Permissions', 'Special access', 'Branches', 'Review'];

function EmployeeWizard({ initial, roles, departments, branches, onCancel, onSave }) {
  const [step, setStep] = useState(0);
  const [f, setF] = useState(initial || {
    name: '', employeeCode: '', email: '', username: '', phone: '', departmentId: departments[0]?.id || '',
    roleId: 'cashier', branchIds: branches.length <= 1 ? (branches[0] ? [branches[0].id] : []) : [],
    branchMode: 'single', status: 'active', pin: '', additionalPermissions: [], restrictedPermissions: [],
  });
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));
  const role = roles.find(r => r.id === f.roleId);
  const rolePerms = role ? role.permissions : [];
  const effective = new Set([...rolePerms, ...f.additionalPermissions].filter(p => !f.restrictedPermissions.includes(p)));

  const toggleAdditional = (id) => setF(x => {
    if (rolePerms.includes(id)) return x; // already granted by role, nothing to add
    const has = x.additionalPermissions.includes(id);
    return { ...x, additionalPermissions: has ? x.additionalPermissions.filter(p => p !== id) : [...x.additionalPermissions, id] };
  });
  const toggleRestricted = (id) => setF(x => {
    const has = x.restrictedPermissions.includes(id);
    return { ...x, restrictedPermissions: has ? x.restrictedPermissions.filter(p => p !== id) : [...x.restrictedPermissions, id] };
  });

  const canNext = () => {
    if (step === 0) return f.name.trim().length > 0;
    return true;
  };

  return (
    <div>
      <div className="flex items-center gap-1.5 mb-5 flex-wrap">
        {EMPLOYEE_WIZARD_STEPS.map((s, i) => (
          <React.Fragment key={s}>
            <span className={'text-xs px-2 py-1 rounded-full ' + (i === step ? 'bg-ink text-paper font-medium' : i < step ? 'text-moss' : 'text-ink-muted')}>{i + 1}. {s}</span>
            {i < EMPLOYEE_WIZARD_STEPS.length - 1 && <span className="text-ink-muted/40">→</span>}
          </React.Fragment>
        ))}
      </div>

      {step === 0 && (
        <div className="space-y-3">
          <Input label="Full name" value={f.name} onChange={e => set('name', e.target.value)} autoFocus />
          <div className="grid grid-cols-2 gap-3">
            <Input label="Employee ID" value={f.employeeCode} onChange={e => set('employeeCode', e.target.value)} placeholder="EMP-007" />
            <Input label="Phone" value={f.phone} onChange={e => set('phone', e.target.value)} />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <Input label="Email / username" value={f.email} onChange={e => set('email', e.target.value)} />
            <Input label="Login username" value={f.username} onChange={e => set('username', e.target.value)} />
          </div>
          <Input label="Temporary PIN (4 digits, for POS approvals)" inputMode="numeric" maxLength={6} value={f.pin} onChange={e => set('pin', e.target.value)} hint="Never stored as plaintext — it's hashed before saving." />
        </div>
      )}

      {step === 1 && (
        <div className="space-y-2">
          <p className="text-sm text-ink-muted mb-2">Which department does {f.name || 'this employee'} belong to?</p>
          {departments.map(d => (
            <button key={d.id} onClick={() => set('departmentId', d.id)} className={'w-full text-left px-3 py-2.5 rounded-lg border flex items-center justify-between ' + (f.departmentId === d.id ? 'border-ink bg-paper-dim' : 'border-line')}>
              <span className="text-sm font-medium">{d.name}</span>
              {f.departmentId === d.id && <IconCheck size={15}/>}
            </button>
          ))}
        </div>
      )}

      {step === 2 && (
        <div className="space-y-2">
          <p className="text-sm text-ink-muted mb-2">Choose this employee's role — it sets their baseline permissions.</p>
          {roles.filter(r => r.active && !r.isOwner).map(r => (
            <button key={r.id} onClick={() => set('roleId', r.id)} className={'w-full text-left px-3 py-2.5 rounded-lg border ' + (f.roleId === r.id ? 'border-ink bg-paper-dim' : 'border-line')}>
              <div className="flex items-center justify-between">
                <span className="text-sm font-medium">{r.name}</span>
                {f.roleId === r.id && <IconCheck size={15}/>}
              </div>
              <p className="text-xs text-ink-muted mt-0.5">{r.description}</p>
            </button>
          ))}
        </div>
      )}

      {step === 3 && (
        <div>
          <p className="text-sm text-ink-muted mb-2">Permissions that come from the <span className="font-medium text-ink">{role?.name}</span> role:</p>
          <div className="border border-line rounded-lg p-3 max-h-72 overflow-y-auto space-y-3">
            {PERMISSION_CATALOG.map(cat => {
              const items = cat.permissions.filter(p => rolePerms.includes(p.id));
              if (!items.length) return null;
              return (
                <div key={cat.category}>
                  <p className="text-xs font-semibold text-ink-muted mb-1">{cat.categoryLabel}</p>
                  <div className="flex flex-wrap gap-1.5">
                    {items.map(p => <Badge key={p.id} tone="good">{p.label}</Badge>)}
                  </div>
                </div>
              );
            })}
            {rolePerms.length === 0 && <p className="text-sm text-ink-muted">This role has no permissions assigned.</p>}
          </div>
        </div>
      )}

      {step === 4 && (
        <div>
          <p className="text-sm text-ink-muted mb-1">Give <span className="font-medium text-ink">{f.name || 'this employee'}</span> access to anything extra, beyond their role — or restrict something their role would normally allow.</p>
          <p className="text-xs font-semibold text-ink-muted mt-3 mb-1.5">Additional permissions</p>
          <PermissionChecklist selected={[...rolePerms, ...f.additionalPermissions]} disabledIds={rolePerms} onToggle={toggleAdditional} />
          <p className="text-xs font-semibold text-ink-muted mt-3 mb-1.5">Restricted (explicitly denied, overrides role)</p>
          <div className="flex flex-wrap gap-1.5">
            {rolePerms.length === 0 && <p className="text-xs text-ink-muted">Nothing to restrict — this role grants no permissions.</p>}
            {rolePerms.map(id => (
              <button key={id} onClick={() => toggleRestricted(id)}
                className={'text-xs px-2 py-1 rounded-full border ' + (f.restrictedPermissions.includes(id) ? 'bg-clay-light border-clay text-clay' : 'border-line text-ink-muted')}>
                {permLabel(id)}
              </button>
            ))}
          </div>
        </div>
      )}

      {step === 5 && (
        <div>
          <p className="text-sm text-ink-muted mb-2">Which branches can {f.name || 'this employee'} access?</p>
          <div className="flex gap-2 mb-3">
            <button onClick={() => set('branchIds', 'all')} className={'flex-1 py-2 rounded-md border text-sm ' + (f.branchIds === 'all' ? 'border-ink bg-paper-dim' : 'border-line')}>All branches</button>
            <button onClick={() => set('branchIds', [])} className={'flex-1 py-2 rounded-md border text-sm ' + (Array.isArray(f.branchIds) ? 'border-ink bg-paper-dim' : 'border-line')}>Specific branches</button>
          </div>
          {Array.isArray(f.branchIds) && (
            <div className="space-y-1.5">
              {branches.map(b => {
                const checked = f.branchIds.includes(b.id);
                return (
                  <label key={b.id} className="flex items-center gap-2 text-sm px-2 py-1.5 rounded-md hover:bg-paper-dim cursor-pointer">
                    <input type="checkbox" checked={checked} onChange={() => set('branchIds', checked ? f.branchIds.filter(x => x !== b.id) : [...f.branchIds, b.id])} className="rounded border-line" />
                    {b.name}
                  </label>
                );
              })}
            </div>
          )}
        </div>
      )}

      {step === 6 && (
        <div className="space-y-3">
          <p className="text-sm">
            <span className="font-medium">{f.name}</span> will be able to access <span className="font-medium">{effective.size}</span> permission{effective.size !== 1 ? 's' : ''} as a <span className="font-medium">{role?.name}</span>{f.departmentId ? ' in ' + (departments.find(d=>d.id===f.departmentId)?.name || '') : ''}.
          </p>
          <div className="border border-line rounded-lg divide-y divide-line text-sm">
            {['pos','products','inventory','customers','suppliers','expenses','reports','employees','settings','admin'].map(cat => {
              const catDef = PERMISSION_CATALOG.find(c => c.category === cat);
              const total = catDef.permissions.length;
              const has = catDef.permissions.filter(p => effective.has(p.id)).length;
              return (
                <div key={cat} className="flex items-center justify-between px-3 py-2">
                  <span>{catDef.categoryLabel}</span>
                  <Badge tone={has === 0 ? 'default' : has === total ? 'good' : 'warn'}>{has === 0 ? 'No access' : has === total ? 'Full access' : has + ' of ' + total}</Badge>
                </div>
              );
            })}
          </div>
          <p className="text-xs text-ink-muted">Branch access: {f.branchIds === 'all' ? 'All branches' : (f.branchIds.length ? f.branchIds.map(id => branches.find(b=>b.id===id)?.name).join(', ') : 'None selected')}</p>
        </div>
      )}

      <div className="flex justify-between mt-6">
        {step > 0 ? <Button variant="ghost" onClick={() => setStep(s => s - 1)}>Back</Button> : <Button variant="ghost" onClick={onCancel}>Cancel</Button>}
        {step < EMPLOYEE_WIZARD_STEPS.length - 1
          ? <Button variant="primary" disabled={!canNext()} onClick={() => setStep(s => s + 1)}>Continue</Button>
          : <Button variant="brass" onClick={() => onSave(f)}>{initial ? 'Save changes' : 'Create employee'}</Button>}
      </div>
    </div>
  );
}

    <div className="space-y-4">

        <div className="flex-1">
          <p className="font-display text-lg font-medium">{employee.name}</p>

      </div>

        <div><p className="text-xs text-ink-muted">Last login</p><p>{employee.lastLogin ? fmtDateTime(employee.lastLogin) : 'Never'}</p></div>

          <p className="text-xs font-semibold text-moss mb-1.5">Additional</p>

        <div><p className="text-xs font-semibold text-ink-muted mb-1.5">Restricted permissions</p>
          <div className="flex flex-wrap gap-1.5">{restricted.map(id => <Badge key={id} tone="bad">{permLabel(id)}</Badge>)}</div>

}

function Employees({ state, actions, ctx }) {
  const { employees, sales, roles, departments, branches } = state;
  const currentEmployee = ctx.currentEmployee;
  const canCreate = can(currentEmployee, roles, 'employees.create');
  const canEdit = can(currentEmployee, roles, 'employees.edit');
  const canSuspend = can(currentEmployee, roles, 'employees.suspend');
  const canResetPin = can(currentEmployee, roles, 'employees.password.reset');
  const canDelete = can(currentEmployee, roles, 'employees.delete');

  const [wizard, setWizard] = useState(null); // {mode:'add'|'edit', employee}
  const [profileFor, setProfileFor] = useState(null);
  const [search, setSearch] = useState('');

  const filtered = employees.filter(e => e.name.toLowerCase().includes(search.toLowerCase()));
  const activeCount = employees.filter(e => e.status === 'active').length;

  const handleSave = (f) => {
    if (wizard.mode === 'edit') {
      actions.updateEmployee({ ...wizard.employee, ...f });
      ctx.logActivity(currentEmployee?.name, 'Edited employee', 'employees', f.name, 'success', '');
    } else {
      actions.addEmployee(f);
      ctx.logActivity(currentEmployee?.name, 'Created employee', 'employees', f.name, 'success', 'Role: ' + (roles.find(r=>r.id===f.roleId)?.name));
    }
    setWizard(null);
    ctx.toast('Employee saved.', 'good');
  };

  const handleSuspendToggle = (e) => {
    if (e.status === 'active') { actions.setEmployeeStatus(e.id, 'suspended'); ctx.logActivity(currentEmployee?.name, 'Suspended employee', 'employees', e.name, 'success', ''); ctx.toast(e.name + ' suspended.', 'warn'); }
    else { actions.setEmployeeStatus(e.id, 'active'); ctx.logActivity(currentEmployee?.name, 'Reactivated employee', 'employees', e.name, 'success', ''); ctx.toast(e.name + ' reactivated.', 'good'); }
  };
  const handleDeactivate = (e) => {
    actions.setEmployeeStatus(e.id, 'deactivated');
    ctx.logActivity(currentEmployee?.name, 'Deactivated employee', 'employees', e.name, 'success', '');
    ctx.toast(e.name + ' deactivated.', 'warn');
  };
  const handleResetPin = async (e) => {
    const newPin = String(Math.floor(1000 + Math.random() * 9000));
    await actions.resetEmployeePin(e.id, newPin);
    ctx.logActivity(currentEmployee?.name, 'Reset PIN', 'employees', e.name, 'success', '');
    ctx.toast(e.name + "'s new temporary PIN is " + newPin + ' — share it securely.', 'good');
  };
  const handleDelete = (e) => {
    if (e.roleId === 'owner' || roles.find(r => r.id === e.roleId)?.isOwner) { ctx.toast('The owner account is protected and cannot be deleted.', 'bad'); return; }
    actions.deleteEmployee(e.id);
    ctx.logActivity(currentEmployee?.name, 'Deleted employee', 'employees', e.name, 'success', '');
    ctx.toast(e.name + ' removed.', 'good');
  };

  return (
    <div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-4">
        <StatCard label="Team members" value={employees.length} />
        <StatCard label="Active" value={activeCount} />
        <StatCard label="Roles in use" value={new Set(employees.map(e => e.roleId)).size} />
        <StatCard label="Departments" value={departments.length} />
      </div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="flex items-center gap-2 bg-paper-raised border border-line rounded-md px-3 py-1.5 max-w-xs w-full">
          <IconSearch size={14} className="text-ink-muted" />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search employees…" className="bg-transparent outline-none text-sm w-full" />
        </div>
        {canCreate && <Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setWizard({ mode: 'add' })}>Add employee</Button>}
      </div>
      <Card padded={false}>
        {filtered.length === 0 ? <EmptyState icon={<IconUser size={22}/>} title="No employees yet" message="Add your team and assign roles to control what each person can access." action={canCreate ? <Button variant="primary" icon={<IconPlus size={15}/>} onClick={() => setWizard({ mode: 'add' })}>Add employee</Button> : null} /> : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-left text-xs text-ink-muted border-b border-line">
              <th className="px-4 py-2.5 font-medium">Name</th><th className="px-2 py-2.5 font-medium">Role</th><th className="px-2 py-2.5 font-medium">Department</th>
              <th className="px-2 py-2.5 font-medium">Branch</th><th className="px-2 py-2.5 font-medium">Status</th><th className="px-2 py-2.5 font-medium">Last active</th>
              <th className="px-4 py-2.5 font-medium text-right">Actions</th>
            </tr></thead>
            <tbody>{filtered.map(e => {
              const role = roles.find(r => r.id === e.roleId);
              const dept = departments.find(d => d.id === e.departmentId);
              const isOwner = role?.isOwner;
              return (
                <tr key={e.id} className="border-b border-line last:border-0 hover:bg-paper-dim/50">
                  <td className="px-4 py-2.5 cursor-pointer" onClick={() => setProfileFor(e)}>
                    <div className="flex items-center gap-2">
                      <div className="w-7 h-7 rounded-full bg-ink text-paper flex items-center justify-center text-xs font-medium shrink-0">{initials(e.name)}</div>
                      <span className="font-medium">{e.name}</span>
                    </div>
                  </td>
                  <td className="px-2 py-2.5"><Badge tone="brand">{role?.name || '—'}</Badge></td>
                  <td className="px-2 py-2.5 text-ink-muted">{dept?.name || '—'}</td>
                  <td className="px-2 py-2.5 text-ink-muted">{e.branchIds === 'all' ? 'All' : (e.branchIds || []).length}</td>
                  <td className="px-2 py-2.5"><StatusBadge status={e.status} /></td>
                  <td className="px-2 py-2.5 text-ink-muted whitespace-nowrap">{e.lastLogin ? fmtDate(e.lastLogin) : 'Never'}</td>
                  <td className="px-4 py-2.5">
                    <div className="flex justify-end gap-1">
                      {canEdit && !isOwner && <button onClick={() => setWizard({ mode: 'edit', employee: e })} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted" title="Edit"><IconEdit size={14}/></button>}
                      {canResetPin && <button onClick={() => handleResetPin(e)} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted" title="Reset PIN"><IconKey size={14}/></button>}
                      {canSuspend && !isOwner && <button onClick={() => handleSuspendToggle(e)} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted" title={e.status === 'active' ? 'Suspend' : 'Reactivate'}><IconLock size={14}/></button>}
                      {canDelete && !isOwner && <button onClick={() => handleDelete(e)} className="p-1.5 rounded hover:bg-paper-dim text-ink-muted" title="Delete"><IconTrash size={14}/></button>}
                      {isOwner && <span className="text-xs text-ink-muted italic px-1">Protected</span>}
                    </div>
                  </td>
                </tr>
              );
            })}</tbody>
          </table>
        </div>
        )}
      </Card>

      <Modal open={!!wizard} onClose={() => setWizard(null)} title={wizard?.mode === 'edit' ? 'Edit employee access' : 'Add employee'} width="max-w-xl">
        {wizard && <EmployeeWizard initial={wizard.employee} roles={roles} departments={departments} branches={branches} onCancel={() => setWizard(null)} onSave={handleSave} />}
      </Modal>

      <Modal open={!!profileFor} onClose={() => setProfileFor(null)} title="Employee profile" width="max-w-lg">
        {profileFor && <EmployeeProfile employee={profileFor} roles={roles} departments={departments} branches={branches} auditLogs={state.auditLogs} sales={sales}
          onClose={() => setProfileFor(null)} onEdit={() => { setWizard({ mode: 'edit', employee: profileFor }); setProfileFor(null); }} />}
      </Modal>
    </div>
  );
}

function RoleEditor({ initial, onCancel, onSave }) {
  const [f, setF] = useState(initial || { name: '', description: '', permissions: [] });
  const [search, setSearch] = useState('');
  const toggle = (id) => setF(x => ({ ...x, permissions: x.permissions.includes(id) ? x.permissions.filter(p => p !== id) : [...x.permissions, id] }));
  return (

function RolesPermissions({ state, actions, ctx }) {

                <div className="flex items-center justify-between text-xs text-ink-muted pt-2 border-t border-line">

      {tab === 'matrix' && (
        <Card padded={false}>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="border-b border-line">
                <th className="text-left px-4 py-2.5 text-xs font-medium text-ink-muted sticky left-0 bg-paper-raised">Permission</th>

function Reports({ state }) {
  const { products, employees, business, branches } = state;
  const [tab, setTab] = useState('sales');
  const [branchFilter, setBranchFilter] = useState('All');
  const sales = state.sales.filter(s => branchFilter === 'All' || (s.branchId || 'branch_main') === branchFilter);
  const expenses = state.expenses.filter(e => branchFilter === 'All' || (e.branchId || 'branch_main') === branchFilter);

  const salesByDay = {};
  sales.forEach(s => { const k = dayKey(s.date); salesByDay[k] = (salesByDay[k] || 0) + s.total; });
  const last14 = [...Array(14)].map((_, i) => {
    const key = dayKey(isoDaysAgo(13 - i));
    return { label: new Date(key).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }).split(' ')[0], value: salesByDay[key] || 0 };
  });

  const byEmployee = {};
  sales.forEach(s => { byEmployee[s.employeeName] = (byEmployee[s.employeeName] || 0) + s.total; });
  const employeeData = Object.entries(byEmployee).sort((a,b) => b[1]-a[1]).map(([label,value]) => ({label,value}));

  const byPayment = {};
  sales.forEach(s => { byPayment[s.paymentMethod] = (byPayment[s.paymentMethod] || 0) + s.total; });
  const paymentData = Object.entries(byPayment).sort((a,b) => b[1]-a[1]).map(([label,value]) => ({label,value}));

  const productQty = {}, productRevenue = {};
  sales.forEach(s => s.items.forEach(it => { productQty[it.name] = (productQty[it.name]||0)+it.qty; productRevenue[it.name] = (productRevenue[it.name]||0)+it.total; }));
  const productData = Object.keys(productQty).map(name => ({ name, qty: productQty[name], revenue: productRevenue[name] })).sort((a,b) => b.revenue-a.revenue);

  const inventoryValuation = products.map(p => ({ name: p.name, qty: p.stock, cost: p.cost, value: p.stock * p.cost })).sort((a,b) => b.value - a.value);
  const totalInvValue = inventoryValuation.reduce((a,p) => a+p.value, 0);

  const totalExpenses = expenses.reduce((a,e) => a+e.amount, 0);
  const totalRevenue = sales.reduce((a,s) => a+s.total, 0);

function InsightsPanel({ sales, products, business }) {
  const insights = [];
  const now = new Date();
  const last7 = sales.filter(s => (now - new Date(s.date)) / 86400000 <= 7 && s.status !== 'refunded');
  const prev7 = sales.filter(s => { const d = (now - new Date(s.date)) / 86400000; return d > 7 && d <= 14 && s.status !== 'refunded'; });
  const last7Total = last7.reduce((a, s) => a + s.total, 0);
  const prev7Total = prev7.reduce((a, s) => a + s.total, 0);
  if (prev7Total > 0) {
    const pct = Math.round(((last7Total - prev7Total) / prev7Total) * 100);
    if (Math.abs(pct) >= 5) insights.push({ tone: pct >= 0 ? 'good' : 'bad', text: 'Sales ' + (pct >= 0 ? 'increased' : 'decreased') + ' ' + Math.abs(pct) + '% over the last 7 days compared to the previous 7.' });
  }

  const qtyByProduct = {};
  sales.filter(s => s.status !== 'refunded').forEach(s => s.items.forEach(it => { qtyByProduct[it.name] = (qtyByProduct[it.name] || 0) + it.qty; }));
  const ranked = Object.entries(qtyByProduct).sort((a, b) => b[1] - a[1]);
  if (ranked.length > 0) insights.push({ tone: 'good', text: ranked[0][0] + ' is your fastest-selling item, with ' + ranked[0][1] + ' units sold.' });
  const soldNames = new Set(Object.keys(qtyByProduct));
  const neverSold = products.filter(p => !p.isComposite && p.status === 'active' && !soldNames.has(p.name));
  if (neverSold.length > 0) insights.push({ tone: 'warn', text: neverSold.length + ' active product' + (neverSold.length !== 1 ? 's have' : ' has') + ' had no sales at all: ' + neverSold.slice(0, 3).map(p => p.name).join(', ') + (neverSold.length > 3 ? '…' : '') + '.' });

  products.filter(p => !p.isComposite && p.status === 'active').forEach(p => {
    const soldLast14 = sales.filter(s => (now - new Date(s.date)) / 86400000 <= 14 && s.status !== 'refunded').reduce((a, s) => a + s.items.filter(it => it.productId === p.id).reduce((b, it) => b + it.qty, 0), 0);
    const avgDaily = soldLast14 / 14;
    if (avgDaily > 0) {
      const daysLeft = p.stock / avgDaily;
      if (daysLeft <= 4 && p.stock > 0) insights.push({ tone: 'bad', text: p.name + ' may run out within ' + Math.max(1, Math.round(daysLeft)) + ' day' + (Math.round(daysLeft) !== 1 ? 's' : '') + ' at its current sales pace.' });
    }
  });

  const todayRefunds = sales.filter(s => dayKey(s.date) === dayKey(now.toISOString()) && s.status === 'refunded').length;
  const avgDailyRefunds = sales.filter(s => s.status === 'refunded' && (now - new Date(s.date)) / 86400000 <= 14).length / 14;
  if (todayRefunds >= 2 && avgDailyRefunds > 0 && todayRefunds > avgDailyRefunds * 2) {
    insights.push({ tone: 'bad', text: 'Refund activity is unusually high today: ' + todayRefunds + ' refund' + (todayRefunds !== 1 ? 's' : '') + ' vs a daily average of ' + avgDailyRefunds.toFixed(1) + '.' });
  }

  const todayDiscounted = sales.filter(s => dayKey(s.date) === dayKey(now.toISOString()) && (s.discountPct || 0) > 0);
  const avgTodayDiscount = todayDiscounted.length ? todayDiscounted.reduce((a, s) => a + (s.discountPct || 0), 0) / todayDiscounted.length : 0;
  const historicalDiscounted = sales.filter(s => (s.discountPct || 0) > 0 && dayKey(s.date) !== dayKey(now.toISOString()));
  const avgHistoricalDiscount = historicalDiscounted.length ? historicalDiscounted.reduce((a, s) => a + (s.discountPct || 0), 0) / historicalDiscounted.length : 0;
  if (avgTodayDiscount > 0 && avgHistoricalDiscount > 0 && avgTodayDiscount > avgHistoricalDiscount * 1.5) {
    insights.push({ tone: 'warn', text: "Today's average discount (" + avgTodayDiscount.toFixed(0) + '%) is notably higher than the usual ' + avgHistoricalDiscount.toFixed(0) + '%.' });
  }

  return (
    <div className="space-y-5">
      <div className="bg-brass-light text-brass-dark text-xs rounded-lg px-4 py-2.5 flex items-start gap-2">
        <IconAlert size={14} className="mt-0.5 shrink-0" />
        These insights are calculated directly from your recorded sales and inventory data — nothing here is generated or guessed.
      </div>
      {insights.length === 0 ? (
        <Card><p className="text-sm text-ink-muted text-center py-6">Not enough data yet to surface meaningful insights. Insights will appear here as more sales are recorded.</p></Card>
      ) : (
        <div className="space-y-2.5">
          {insights.map((ins, i) => (
            <div key={i} className={'flex items-start gap-2.5 px-4 py-3 rounded-lg text-sm ' + (ins.tone === 'good' ? 'bg-moss-light text-moss' : ins.tone === 'bad' ? 'bg-clay-light text-clay' : 'bg-brass-light text-brass-dark')}>
              {ins.tone === 'good' ? <IconArrowUp size={15} className="mt-0.5 shrink-0"/> : <IconAlert size={15} className="mt-0.5 shrink-0"/>}
              <span>{ins.text}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      if (e.key === 'Escape') setPaletteOpen(false);
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

    const id = uid('toast');
    setToasts(t => [...t, { id, message, tone }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);

    };
    setBusiness(biz);
    setDark(data.theme === 'dark');
    if (data.dataChoice === 'demo') {

      const hashedEmployees = await finalizeSeedPins(seed.employees);
      setProducts(seed.products); setSuppliers(seed.suppliers); setCustomers(seed.customers);
      setEmployees(hashedEmployees); setSales(seed.sales); setInventoryMovements(seed.inventoryMovements);
      setExpenses(seed.expenses); setPurchases(seed.purchases);
      setSettings(s => ({ ...s, paymentMethods: seed.paymentMethods }));
      setRoles(seed.roles); setDepartments(seed.departments); setBranches(seed.branches);
      setLoyaltySettings(seed.loyaltySettings); setCoupons(seed.coupons); setTables(seed.tables); setRegisterSessions(seed.registerSessions);
      setAuditLogs(seed.auditLogs); setFailedLogins(seed.failedLogins);
      setCurrentEmployeeId(hashedEmployees[0].id);
    } else {
      const ownerPinHash = await hashPin('0000');
      const ownerId = uid('emp');
      const dept = DEPARTMENTS_SEED.map(d => ({ ...d }));
      const branch = BRANCHES_SEED.map(b => ({ ...b }));
      setCustomers([{ id: uid('cust'), name: 'Walk-in Customer', phone: '', email: '', totalSpent: 0, balance: 0, joined: new Date().toISOString(), isWalkIn: true }]);
      setEmployees([{ id: ownerId, name: 'You (Owner)', roleId: 'owner', employeeCode: 'EMP-001', email: '', username: 'owner', phone: '', departmentId: dept[3]?.id || dept[0]?.id, branchIds: 'all', status: 'active', joined: new Date().toISOString(), lastLogin: new Date().toISOString(), pinHash: ownerPinHash, additionalPermissions: [], restrictedPermissions: [] }]);
      setRoles(seedRoles()); setDepartments(dept); setBranches(branch);
      setCurrentEmployeeId(ownerId);
    }
    setOnboarded(true);
  };

  const actions = {
    recordSale: (sale) => {
      sale = { ...sale, branchId: sale.branchId || activeBranchId };
      setSales(s => [sale, ...s]);
      setProducts(prods => prods.map(p => {
        const item = sale.items.find(i => i.productId === p.id);
        if (!item) return p;
        if (item.variantId) {
          const variant = (p.variants || []).find(v => v.id === item.variantId);
          if (!variant) return p;
          const prev = variant.stock; const next = Math.max(0, variant.stock - item.qty);
          setInventoryMovements(m => [{ id: uid('mov'), date: sale.date, productId: p.id, productName: p.name + ' (' + variant.name + ')', type: 'sale', qtyChange: -item.qty, prevQty: prev, newQty: next, reason: 'Sale ' + sale.id.slice(-6), ref: sale.id, user: sale.employeeName }, ...m]);
          return { ...p, variants: p.variants.map(v => v.id === variant.id ? { ...v, stock: next } : v) };
        }
        if (p.isComposite) return p; // components are deducted separately below
        const prev = p.stock; const next = Math.max(0, p.stock - item.qty);
        setInventoryMovements(m => [{ id: uid('mov'), date: sale.date, productId: p.id, productName: p.name, type: 'sale', qtyChange: -item.qty, prevQty: prev, newQty: next, reason: 'Sale ' + sale.id.slice(-6), ref: sale.id, user: sale.employeeName }, ...m]);
        return { ...p, stock: next };
      }));
      // Deduct recipe/bundle ingredients for any composite items sold.
      sale.items.forEach(item => {
        const parent = products.find(p => p.id === item.productId);
        if (parent && parent.isComposite) {
          setProducts(prods => prods.map(p => {
            const comp = parent.components.find(c => c.productId === p.id);
            if (!comp) return p;
            const deduction = comp.qty * item.qty;
            const prev = p.stock; const next = Math.max(0, p.stock - deduction);
            setInventoryMovements(m => [{ id: uid('mov'), date: sale.date, productId: p.id, productName: p.name, type: 'sale', qtyChange: -deduction, prevQty: prev, newQty: next, reason: 'Recipe: ' + parent.name + ' × ' + item.qty, ref: sale.id, user: sale.employeeName }, ...m]);
            return { ...p, stock: next };
          }));
        }
      });
      if (sale.customerId) setCustomers(cs => cs.map(c => c.id === sale.customerId ? {
        ...c, totalSpent: c.totalSpent + sale.total,
        loyaltyPoints: Math.max(0, (c.loyaltyPoints || 0) + (sale.pointsEarned || 0) - (sale.pointsRedeemed || 0)),
      } : c));
    },
    refundSale: (saleId) => {
      setSales(ss => ss.map(s => s.id === saleId ? { ...s, status: 'refunded' } : s));
      const sale = sales.find(s => s.id === saleId);
      if (!sale) return;
      setProducts(prods => prods.map(p => {
        const item = sale.items.find(i => i.productId === p.id);
        if (!item) return p;
        if (item.variantId) {
          const variant = (p.variants || []).find(v => v.id === item.variantId);
          if (!variant) return p;
          const prev = variant.stock; const next = variant.stock + item.qty;
          setInventoryMovements(m => [{ id: uid('mov'), date: new Date().toISOString(), productId: p.id, productName: p.name + ' (' + variant.name + ')', type: 'return', qtyChange: item.qty, prevQty: prev, newQty: next, reason: 'Refund for sale ' + sale.id.slice(-6), ref: sale.id, user: 'System' }, ...m]);
          return { ...p, variants: p.variants.map(v => v.id === variant.id ? { ...v, stock: next } : v) };
        }
        if (p.isComposite) return p;
        const prev = p.stock; const next = p.stock + item.qty;
        setInventoryMovements(m => [{ id: uid('mov'), date: new Date().toISOString(), productId: p.id, productName: p.name, type: 'return', qtyChange: item.qty, prevQty: prev, newQty: next, reason: 'Refund for sale ' + sale.id.slice(-6), ref: sale.id, user: 'System' }, ...m]);
        return { ...p, stock: next };
      }));
      sale.items.forEach(item => {
        const parent = products.find(p => p.id === item.productId);
        if (parent && parent.isComposite) {
          setProducts(prods => prods.map(p => {
            const comp = parent.components.find(c => c.productId === p.id);
            if (!comp) return p;
            const restore = comp.qty * item.qty;
            const prev = p.stock; const next = p.stock + restore;
            setInventoryMovements(m => [{ id: uid('mov'), date: new Date().toISOString(), productId: p.id, productName: p.name, type: 'return', qtyChange: restore, prevQty: prev, newQty: next, reason: 'Refund restored ingredient for ' + parent.name, ref: sale.id, user: 'System' }, ...m]);
            return { ...p, stock: next };
          }));
        }
      });
      if (sale.customerId) setCustomers(cs => cs.map(c => c.id === sale.customerId ? {
        ...c, totalSpent: Math.max(0, c.totalSpent - sale.total),
        loyaltyPoints: Math.max(0, (c.loyaltyPoints || 0) - (sale.pointsEarned || 0) + (sale.pointsRedeemed || 0)),
      } : c));
    },
    addProduct: (p) => setProducts(ps => [...ps, { ...p, id: uid('prod') }]),
    updateProduct: (p) => setProducts(ps => ps.map(x => x.id === p.id ? p : x)),
    deleteProduct: (id) => setProducts(ps => ps.filter(x => x.id !== id)),
    adjustStock: (id, qty, reason) => {
      setProducts(ps => ps.map(p => {
        if (p.id !== id) return p;
        const prev = p.stock; const next = Math.max(0, p.stock + qty);
        setInventoryMovements(m => [{ id: uid('mov'), date: new Date().toISOString(), productId: p.id, productName: p.name, type: 'adjustment', qtyChange: qty, prevQty: prev, newQty: next, reason, ref: null, user: 'You' }, ...m]);
        return { ...p, stock: next };
      }));
    },
    addSupplier: (s) => setSuppliers(ss => [...ss, { ...s, id: uid('sup') }]),
    updateSupplier: (s) => setSuppliers(ss => ss.map(x => x.id === s.id ? s : x)),
    addPurchase: (po) => setPurchases(ps => [po, ...ps]),
    receivePurchase: (id) => {
      setPurchases(ps => ps.map(po => po.id === id ? { ...po, status: 'received' } : po));
      const po = purchases.find(p => p.id === id);
      if (!po) return;
      setProducts(prods => prods.map(p => {
        const item = po.items.find(i => i.productId === p.id);
        if (!item) return p;
        const prev = p.stock; const next = p.stock + item.qty;
        setInventoryMovements(m => [{ id: uid('mov'), date: new Date().toISOString(), productId: p.id, productName: p.name, type: 'purchase', qtyChange: item.qty, prevQty: prev, newQty: next, reason: 'Purchase order received', ref: po.id, user: 'You' }, ...m]);
        return { ...p, stock: next };
      }));
    },
    addCustomer: (c) => setCustomers(cs => [...cs, { ...c, id: uid('cust') }]),
    updateCustomer: (c) => setCustomers(cs => cs.map(x => x.id === c.id ? c : x)),
    deleteCustomer: (id) => setCustomers(cs => cs.filter(x => x.id !== id)),
    addEmployee: async (f) => {
      const { pin, ...rest } = f;
      const pinHash = pin ? await hashPin(pin) : null;
      setEmployees(es => [...es, { ...rest, id: uid('emp'), pinHash, joined: new Date().toISOString(), lastLogin: null }]);
    },
    updateEmployee: async (f) => {
      if (f.pin) {
        const { pin, ...rest } = f;
        const pinHash = await hashPin(pin);
        setEmployees(es => es.map(x => x.id === f.id ? { ...rest, pinHash } : x));
      } else {
        setEmployees(es => es.map(x => x.id === f.id ? { ...x, ...f } : x));
      }
    },
    setEmployeeStatus: (id, status) => setEmployees(es => es.map(e => e.id === id ? { ...e, status } : e)),
    resetEmployeePin: async (id, newPin) => {
      const pinHash = await hashPin(newPin);
      setEmployees(es => es.map(e => e.id === id ? { ...e, pinHash } : e));
    },
    deleteEmployee: (id) => setEmployees(es => es.filter(e => e.id !== id)),
    addRole: (f) => setRoles(rs => [...rs, { id: uid('role'), name: f.name, description: f.description, permissions: f.permissions, isSystem: false, isOwner: false, active: true }]),
    updateRole: (r) => setRoles(rs => rs.map(x => x.id === r.id ? r : x)),
    duplicateRole: (id) => setRoles(rs => {
      const src = rs.find(r => r.id === id);
      if (!src) return rs;
      return [...rs, { ...src, id: uid('role'), name: src.name + ' (Copy)', isSystem: false, isOwner: false }];
    }),
    toggleRoleActive: (id) => setRoles(rs => rs.map(r => r.id === id ? { ...r, active: !r.active } : r)),
    toggleRolePermission: (roleId, permId) => setRoles(rs => rs.map(r => {
      if (r.id !== roleId || r.isOwner) return r;
      return { ...r, permissions: r.permissions.includes(permId) ? r.permissions.filter(p => p !== permId) : [...r.permissions, permId] };
    })),
    addDepartment: (f) => setDepartments(ds => [...ds, { ...f, id: uid('dept') }]),
    updateDepartment: (d) => setDepartments(ds => ds.map(x => x.id === d.id ? d : x)),
    addBranch: (name) => setBranches(bs => [...bs, { id: uid('branch'), name }]),
    deleteBranch: (id) => setBranches(bs => bs.filter(b => b.id !== id)),
    addExpense: (e) => setExpenses(es => [{ ...e, id: uid('exp'), branchId: activeBranchId }, ...es]),
    updateBusiness: (b) => setBusiness(b),
    addPaymentMethod: (m) => setSettings(s => ({ ...s, paymentMethods: [...s.paymentMethods, m] })),
    removePaymentMethod: (m) => setSettings(s => ({ ...s, paymentMethods: s.paymentMethods.filter(x => x !== m) })),
    toggleModule: (mod) => setSettings(s => ({ ...s, enabledModules: { ...s.enabledModules, [mod]: !s.enabledModules[mod] } })),
    setReceiptTemplate: (t) => setSettings(s => ({ ...s, receiptTemplate: t })),
    openRegister: (openingBalance, byName) => setRegisterSessions(rs => [...rs, { id: uid('reg'), branchId: 'branch_main', openedAt: new Date().toISOString(), closedAt: null, openedBy: byName, closedBy: null, openingBalance, cashIn: [], cashOut: [], expectedClosingBalance: null, actualClosingBalance: null, variance: null, status: 'open' }]),
    addCashMovement: (dir, amount, note) => setRegisterSessions(rs => rs.map(s => {
      if (s.status !== 'open') return s;
      const entry = { amount, note, date: new Date().toISOString() };
      return dir === 'in' ? { ...s, cashIn: [...s.cashIn, entry] } : { ...s, cashOut: [...s.cashOut, entry] };
    })),
    closeRegister: (actual, expected, byName) => setRegisterSessions(rs => rs.map(s => s.status === 'open' ? { ...s, status: 'closed', closedAt: new Date().toISOString(), closedBy: byName, expectedClosingBalance: expected, actualClosingBalance: actual, variance: actual - expected } : s)),
    updateLoyaltySettings: (f) => setLoyaltySettings(f),
    addCoupon: (f) => setCoupons(cs => [...cs, { id: uid('cpn'), code: f.code, type: f.type, value: f.value, active: true, usageLimit: f.usageLimit, usedCount: 0 }]),
    toggleCoupon: (id) => setCoupons(cs => cs.map(c => c.id === id ? { ...c, active: !c.active } : c)),
    redeemCoupon: (id) => setCoupons(cs => cs.map(c => c.id === id ? { ...c, usedCount: c.usedCount + 1 } : c)),
    cycleTableStatus: (id) => setTables(ts => ts.map(t => t.id === id ? { ...t, status: TABLE_STATUS_CYCLE[t.status] } : t)),
    assignTableWaiter: (id, waiterId) => setTables(ts => ts.map(t => t.id === id ? { ...t, waiterId } : t)),
    setKitchenStatus: (saleId, status) => setSales(ss => ss.map(s => s.id === saleId ? { ...s, kitchenStatus: status } : s)),
    queueOfflineSale: (payload) => setPendingSyncSales(q => [...q, { ...payload, queueId: uid('offline'), queuedAt: new Date().toISOString() }]),
    toggleDashboardWidget: (key) => setDashboardPrefs(p => ({ ...p, hidden: p.hidden.includes(key) ? p.hidden.filter(h => h !== key) : [...p.hidden, key] })),
    moveDashboardWidget: (key, dir) => setDashboardPrefs(p => {
      const idx = p.order.indexOf(key);
      const swapWith = idx + dir;
      if (swapWith < 0 || swapWith >= p.order.length) return p;
      const next = [...p.order];
      [next[idx], next[swapWith]] = [next[swapWith], next[idx]];
      return { ...p, order: next };
    }),
  };

  useEffect(() => {
    if (!online || pendingSyncSales.length === 0) return;
    const emp = employees.find(e => e.id === currentEmployeeId) || employees[0];
    pendingSyncSales.forEach(q => {
      const cust = customers.find(c => c.id === q.customerId);
      const sale = {
        id: uid('sale'), date: q.queuedAt,
        items: q.cart.map(i => ({ productId: i.productId, variantId: i.variantId || null, name: i.name, qty: i.qty, price: i.price, total: i.price * i.qty })),
        subtotal: q.subtotal, discount: q.discountAmt, discountPct: q.discount, tax: q.tax, total: q.total,
        paymentMethod: q.paymentMethod + ' (synced)', splitPayments: q.splitPayments || null,
        customerId: q.customerId, customerName: cust ? cust.name : 'Walk-in', employeeId: emp?.id, employeeName: emp?.name || 'Unknown', status: 'completed', note: q.note, tableId: q.tableId || null,
        pointsEarned: 0, pointsRedeemed: 0,
      };
      actions.recordSale(sale);
      logActivity(emp?.name, 'Synced offline sale', 'pos', '#' + sale.id.slice(-6).toUpperCase(), 'success', 'Queued while offline at ' + fmtDateTime(q.queuedAt));
    });
    setPendingSyncSales([]);
    toast(pendingSyncSales.length + ' offline sale' + (pendingSyncSales.length !== 1 ? 's' : '') + ' synced.', 'good');
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [online]);

  const requestApproval = useCallback((permissionId, description, targetLabel) => {
    return new Promise(resolve => {
      setApproval({ permissionId, description, targetLabel, requesterId: currentEmployeeId, resolve });
    });
  }, [currentEmployeeId]);

  const handleApprove = (approverEmployee) => {
    logActivity(approverEmployee.name, 'Approved: ' + permLabel(approval.permissionId), 'admin', approval.targetLabel, 'approved',
      'Requested by ' + (employees.find(e => e.id === approval.requesterId)?.name || 'unknown'));
    approval.resolve(true);
    setApproval(null);
  };
  const handleCancelApproval = () => {
    if (approval) approval.resolve(false);
    setApproval(null);
  };
  const handleFailedApproval = () => {
    const requester = employees.find(e => e.id === approval?.requesterId);
    setFailedLogins(f => [{ id: uid('fl'), date: new Date().toISOString(), username: requester?.username || requester?.name || 'unknown', reason: 'Incorrect manager PIN for ' + permLabel(approval.permissionId) }, ...f]);
  };

  if (!onboarded) return <Onboarding onComplete={handleOnboardComplete} />;

  const handleSwitchEmployee = (id) => {
    const target = employees.find(e => e.id === id);
    setEmployees(es => es.map(e => e.id === id ? { ...e, lastLogin: new Date().toISOString() } : e));
    logActivity(target?.name, 'Logged in', 'auth', '', 'success', '');
    setCurrentEmployeeId(id);
  };

  const currentEmployee = employees.find(e => e.id === currentEmployeeId) || employees[0];
  const state = { business, products, suppliers, customers, employees, sales, purchases, expenses, inventoryMovements, settings, roles, departments, branches, auditLogs, failedLogins, loyaltySettings, coupons, tables, registerSessions, dashboardPrefs };
  const ctx = { toast, setPage, dark, setDark, currentEmployee, requestApproval, logActivity, activeBranchId, setActiveBranchId };

  const lowStock = products.filter(p => !p.isComposite && p.stock <= p.reorderLevel);
  const expiringSoon = products.filter(p => p.expiryDate && new Date(p.expiryDate) > new Date() && new Date(p.expiryDate) < new Date(Date.now() + 3 * 86400000));
  const pendingPO = purchases.filter(p => p.status === 'pending');
  const openRegisterSession = registerSessions.find(r => r.status === 'open');
  const notifications = [
    ...lowStock.slice(0, 5).map(p => ({ message: p.name + ' is at ' + p.stock + ' ' + p.unit + ' — below reorder level.', tone: p.stock <= 0 ? 'bad' : 'warn' })),
    ...expiringSoon.slice(0, 3).map(p => ({ message: p.name + ' expires ' + fmtDate(p.expiryDate) + '.', tone: 'warn' })),
    ...pendingPO.map(po => ({ message: 'Purchase order from ' + po.supplierName + ' is awaiting receipt.', tone: 'warn' })),
    ...(pendingSyncSales.length > 0 ? [{ message: pendingSyncSales.length + ' sale(s) queued offline, waiting to sync.', tone: 'warn' }] : []),
  ];

  const pageProps = { state, actions, ctx };
  const pages = {
    dashboard: <Dashboard {...pageProps} />,
    pos: settings.enabledModules.pos ? <POS {...pageProps} /> : <ModuleDisabled name="Point of Sale" />,
    products: settings.enabledModules.inventory ? <Products {...pageProps} /> : <ModuleDisabled name="Products & Inventory" />,
    purchases: settings.enabledModules.purchasing ? <Purchases {...pageProps} /> : <ModuleDisabled name="Purchases & Suppliers" />,
    customers: settings.enabledModules.customers ? <Customers {...pageProps} /> : <ModuleDisabled name="Customers" />,
    expenses: settings.enabledModules.expenses ? <Expenses {...pageProps} /> : <ModuleDisabled name="Expenses" />,
    reports: settings.enabledModules.reports ? <Reports {...pageProps} /> : <ModuleDisabled name="Reports" />,
    register: settings.enabledModules.cash_register ? <CashRegister {...pageProps} /> : <ModuleDisabled name="Cash Register" />,
    loyalty: settings.enabledModules.loyalty ? <Loyalty {...pageProps} /> : <ModuleDisabled name="Loyalty" />,
    restaurant: settings.enabledModules.restaurant ? <Restaurant {...pageProps} /> : <ModuleDisabled name="Restaurant" />,
    employees: <Employees {...pageProps} />,
    roles: <RolesPermissions {...pageProps} />,
    departments: <Departments {...pageProps} />,
    branches: <Branches {...pageProps} />,
    activity: <ActivityLog {...pageProps} />,
    security: <SecurityCenter {...pageProps} />,
    settings: <Settings {...pageProps} />,
  };

  const allNav = [...NAV_ITEMS, ...OPERATIONS_NAV_ITEMS, ...ADMIN_NAV_ITEMS];
  const activeNav = allNav.find(n => n.key === page);
  const allowedPage = activeNav && (!activeNav.perm || can(currentEmployee, roles, activeNav.perm)) ? page : 'dashboard';

  return (
    <div className="min-h-screen flex bg-paper text-ink">
      <Sidebar page={allowedPage} setPage={setPage} business={business} enabledModules={settings.enabledModules} currentEmployee={currentEmployee} roles={roles} collapsed={collapsed} setCollapsed={setCollapsed} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      <div className="flex-1 min-w-0 flex flex-col">
        <Topbar business={business} currentEmployee={currentEmployee} employees={employees} setCurrentEmployeeId={handleSwitchEmployee} roles={roles} dark={dark} setDark={setDark} setMobileOpen={setMobileOpen} notifications={notifications} page={allowedPage} allNav={allNav} onOpenPalette={() => setPaletteOpen(true)} online={online} branches={branches} activeBranchId={activeBranchId} setActiveBranchId={setActiveBranchId} />
        <EmployeeBanner employee={currentEmployee} roles={roles} />
        <main className="flex-1 p-4 md:p-6 rise-in">
          {pages[allowedPage]}
        </main>
      </div>
      <Toast toasts={toasts} />
      <ManagerApprovalModal approval={approval} employees={employees} roles={roles}
        onApprove={handleApprove} onCancel={handleCancelApproval} onFailedAttempt={handleFailedApproval} />
      <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} allNav={allNav} state={state} setPage={setPage} />
    </div>
  );
}

function ModuleDisabled({ name }) {
  return <EmptyState icon={<IconLayers size={22}/>} title={name + ' is turned off'} message="This module has been disabled for your workspace. An owner can re-enable it from Settings → Modules." />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
<script>
  // Babel Standalone's auto-scan defaults the React preset to the "automatic" JSX
  // runtime, which emits `import` statements. A plain inline script isn't a module,
  // so that would throw "Cannot use import statement outside a module" and leave a
  // blank page. We transform explicitly with the classic runtime to avoid that.
  (function () {
    var source = document.getElementById('app-source').textContent;
    try {
      var result = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]],
      }).code;
      var script = document.createElement('script');
      script.textContent = result;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<div style="max-width:520px;margin:80px auto;padding:24px;font-family:sans-serif;border:1px solid #ddd;border-radius:12px;">' +
        '<h2 style="margin-top:0;">Something went wrong loading the app</h2>' +
        '<p style="color:#666;font-size:14px;">' + (err && err.message ? err.message : String(err)) + '</p>' +
        '<p style="color:#999;font-size:12px;">Open your browser console for the full error.</p></div>';
      console.error(err);
    }
  })();
</script>
</body>
</html>
